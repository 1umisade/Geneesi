<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mol2 molecule viewer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
#c{width:100%;height:100%;display:block;touch-action:none}
/* ── Solukko palette: dark brown, beige/paper, light green/sage — cartoony & round ── */
:root{
  --paper:#f2e6c9; --paper2:#e7d4ac; --brown:#4a3320; --ink:#3a2716;
  --sage:#a3b881; --sage2:#82a058; --sageink:#2f3d1c;
}
body.dark-mode{
  --paper:#3a2c1c; --paper2:#2d2113; --brown:#7c5c39; --ink:#f0e2c4;
  --sage:#88a35f; --sage2:#a6bd7d; --sageink:#f1f5e2;
}
#overlay{position:absolute;inset:0;z-index:20;display:flex;
  align-items:center;justify-content:center;background:#f2e6c9;transition:opacity .8s}
#overlay.gone{opacity:0;pointer-events:none}
.ptr{width:280px;height:10px;background:#e7d4ac;border:2.5px solid #4a3320;border-radius:99px;overflow:hidden}
.pfil{height:100%;width:100%;background:#82a058;border-radius:99px;
  transform:scaleX(0);transform-origin:left center;transition:transform .3s linear}
.mlbl{position:absolute;z-index:9;pointer-events:none;color:var(--ink);
  background:var(--paper);border:2.5px solid var(--brown);border-radius:10px;
  padding:2px 8px;font-family:'Courier New',monospace;font-size:11px;font-weight:bold;
  white-space:nowrap;display:none;box-shadow:0 2.5px 0 var(--brown)}
.mlbl.dev{font-size:10px;padding:1px 6px;opacity:.9;box-shadow:0 2px 0 var(--brown)}   /* dev per-model tags: a touch lighter */
#zoomval{position:absolute;top:14px;right:16px;z-index:10;color:var(--brown);
  font-family:'Courier New',monospace;font-size:15px;font-weight:bold;pointer-events:none}
#zoomtips{position:absolute;right:18px;bottom:18px;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;transition:opacity .5s;pointer-events:none;
  font-family:'Courier New',monospace}
#zoomtips.show{opacity:1;pointer-events:auto}
.zt{width:46px;height:46px;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:15px;
  box-shadow:0 4px 0 var(--brown);touch-action:manipulation;user-select:none;
  display:flex;align-items:center;justify-content:center}
.zt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
.ztlabel{font-size:11px;font-weight:bold;color:var(--brown);letter-spacing:1px}
#darkmode-btn{position:absolute;left:16px;top:12px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;
  transition:transform .1s ease,box-shadow .1s ease}
#darkmode-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#darkmode-icon{font-size:16px;line-height:1}
#gfx-btn{position:absolute;left:16px;top:60px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#gfx-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#gfx-icon{font-size:15px;line-height:1}
#color-btn{position:absolute;left:16px;top:108px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#color-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#color-icon{font-size:15px;line-height:1}
#etc-btn{position:absolute;left:16px;top:156px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#etc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#etc-btn.on{background:var(--sage);color:var(--sageink);box-shadow:0 0 0 3px var(--sage2),0 4px 0 var(--brown)}
#etc-icon{font-size:15px;line-height:1}
#dev-btn{position:absolute;left:16px;top:204px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#dev-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#dev-btn.on{background:var(--sage);color:var(--sageink);box-shadow:0 0 0 3px var(--sage2),0 4px 0 var(--brown)}
#dev-icon{font-size:15px;line-height:1}
#vr-btn{position:absolute;left:16px;top:252px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#vr-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#vr-icon{font-size:15px;line-height:1}
#speedbox{color:var(--brown)!important}
#speedbox #speedval{font-weight:bold}
/* Speed slider — same palette as the loading bar (.ptr tan track + #4a3320 border + #82a058 fill) */
#speed{-webkit-appearance:none;appearance:none;height:10px;box-sizing:border-box;border-radius:99px;
  background:#e7d4ac;border:2.5px solid #4a3320;outline:none}
/* Knob = a small sage circle with a dark-brown rim, centred on the 10px track:
   margin-top = (trackHeight − thumb)/2 = (10 − 16)/2 = −3px. */
#speed::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
  background:#82a058;border:2.5px solid #4a3320;cursor:pointer;margin-top:-3px}
#speed::-moz-range-track{height:10px;box-sizing:border-box;border-radius:99px;background:#e7d4ac;border:2.5px solid #4a3320}
#speed::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#82a058;border:2.5px solid #4a3320;cursor:pointer}
/* ── UI gizmo panel: move/rotate handles for the selected complex, docked above the speed slider ── */
#gizmo-ui{position:fixed;left:16px;bottom:96px;z-index:26;display:none;width:154px;
  font-family:'Courier New',monospace;color:var(--ink);background:var(--paper);
  border:3px solid var(--brown);border-radius:16px;box-shadow:0 4px 0 var(--brown);
  padding:8px 10px;user-select:none;-webkit-user-select:none}
#gizmo-ui .giz-title{font-size:11px;font-weight:bold;color:var(--brown);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gizmo-ui .giz-pads{display:flex;gap:8px}
#gizmo-ui .giz-pad{flex:1;height:54px;border:2.5px solid var(--brown);border-radius:12px;background:#e7d4ac;
  cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
#gizmo-ui .giz-pad.active{cursor:grabbing;background:var(--sage);color:var(--sageink)}
#gizmo-ui .giz-pad span{font-size:20px;line-height:1;pointer-events:none}
#gizmo-ui .giz-pad label{font-size:9px;font-weight:bold;pointer-events:none}
#gizmo-ui .giz-btns{display:flex;gap:5px;margin-top:7px}
#gizmo-ui .giz-btns button{flex:1;font-family:inherit;font-size:10px;font-weight:bold;color:var(--ink);
  background:var(--paper);border:2px solid var(--brown);border-radius:8px;padding:4px 2px;cursor:pointer}
#gizmo-ui .giz-btns button:active{background:var(--sage);color:var(--sageink)}
/* ── Bottom-right stack: hybridisation panel sits ABOVE the spawn element table ── */
#br-stack{position:absolute;right:14px;bottom:14px;z-index:25;display:flex;flex-direction:column;
  align-items:flex-end;gap:12px;pointer-events:none}
#br-stack>*{pointer-events:auto}
/* Panels — thick brown outline, big round corners, chunky drop shadow */
#econf,#eltable{font-family:'Courier New',monospace;background:var(--paper);color:var(--ink);
  border:3px solid var(--brown);border-radius:18px;box-shadow:0 5px 0 var(--brown);user-select:none}
#eltable{padding:10px 11px;max-width:280px}
#eltable .elhdr{font-size:12px;font-weight:bold;color:var(--brown);letter-spacing:.5px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
#eltable .elclear{font-family:inherit;font-size:11px;font-weight:bold;color:var(--sageink);background:var(--sage);
  border:2.5px solid var(--brown);border-radius:99px;padding:3px 11px;cursor:pointer;box-shadow:0 2px 0 var(--brown)}
#eltable .elclear:active{transform:translateY(1px);box-shadow:0 1px 0 var(--brown)}
#eltable .elgrid{display:grid;grid-template-columns:repeat(6,37px);gap:6px}
.elbtn{font-family:inherit;font-size:13px;font-weight:bold;color:var(--ink);background:var(--paper2);
  border:2.5px solid var(--brown);border-radius:12px;padding:5px 0 4px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;box-shadow:0 2.5px 0 var(--brown);transition:transform .08s,box-shadow .08s}
.elbtn:hover{background:var(--sage)}
.elbtn:active{transform:translateY(2px);box-shadow:0 0.5px 0 var(--brown)}
.elbtn .eldot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.5px var(--brown)}
.elbtn.on{background:var(--sage);color:var(--sageink);box-shadow:0 0 0 3px var(--sage2),0 2.5px 0 var(--brown)}
/* Orbital chips (electron-config panel) */
.orb-chip{font-family:inherit;font-size:14px;font-weight:bold;color:var(--ink);background:var(--paper2);
  border:2.5px solid var(--brown);border-radius:13px;padding:4px 9px 5px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:4px;line-height:1;box-shadow:0 2.5px 0 var(--brown)}
.orb-chip.on{background:var(--sage);color:var(--sageink);box-shadow:0 0 0 3px var(--sage2),0 2.5px 0 var(--brown)}
/* Electron dot that RADIATES expanding wave rings — same idea as the 3-D electrons */
.orb-e{position:relative;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#dcecff,#4f8dff 72%);box-shadow:0 0 3px rgba(79,141,255,.85)}
.orb-e::before,.orb-e::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-3.5px 0 0 -3.5px;border-radius:50%;border:1.5px solid rgba(95,150,255,.85);animation:eripple 1.7s ease-out infinite}
.orb-e::after{animation-delay:.85s}
@keyframes eripple{0%{transform:scale(.5);opacity:.9}60%{opacity:.35}100%{transform:scale(3);opacity:0}}
#c.spawning{cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="ptr"><div class="pfil" id="load-bar"></div></div>
</div>
<button id="darkmode-btn" title="Vaihda tummatila"><span id="darkmode-icon">☀️</span>Teema</button>
<button id="gfx-btn" title="Vaihda esitystapa (orbitaalit ↔ vdW-pallot)"><span id="gfx-icon">⬤</span><span id="gfx-label">vdW-pallot</span></button>
<button id="color-btn" title="Väritys: alkuaineittain ↔ malleittain"><span id="color-icon">🎨</span><span id="color-label">Alkuaineet</span></button>
<button id="etc-btn" title="Korosta elektroninsiirtoketjun kofaktorit (klorofyllit, karotenoidit, kinonit, hemit, feofytiini, Tyr Z, OEC, Fe-S) päälle"><span id="etc-icon">⚡</span><span id="etc-label">ETC-ketju</span></button>
<button id="dev-btn" title="Dev-tila: mallien siirto/kierto-työkalu + sijaintimerkinnät"><span id="dev-icon">🛠️</span><span id="dev-label">Dev</span></button>
<button id="vr-btn" title="Siirry VR-tilaan" style="display:none"><span id="vr-icon">🥽</span><span id="vr-label">VR</span></button>
<div id="zoomval">1.0×</div>
<div id="zoomtips">
  <button class="zt" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="zt" id="zoom-out" aria-label="Zoom out">−</button>
  <span class="ztlabel">suurenna</span>
</div>
<div id="speedbox" style="position:fixed; left:16px; bottom:14px; z-index:10; font:11px ui-monospace,monospace; color:#6a6a5a; user-select:none;">
  <div style="margin-bottom:4px; letter-spacing:.5px;">speed <span id="speedval">1.0×</span></div>
  <input id="speed" type="range" min="0" max="30" value="10" style="width:130px; cursor:pointer;">
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
'use strict';

const BOND_R    = 0.10;  // stick radius (Å) — thinner than the smallest ball
const GAP_FRAC  = 0.15;  // side-by-side gap as a fraction of mean model width
const FILL_SCALE = 0.72; // space-filling sphere size as a fraction of vdW radius (tightened so the surface ≈ the orbital cloud, not much bigger)

/* ── Standard CPK-ish colours (c), ball radii (r) + van der Waals radii (vr), Å.
      C dark grey, H light grey.  vr drives the space-filling surface mode.  ── */
/* n = nucleon count (mass number) → nucleus size; z = proton count; en = Pauling electronegativity (bond polarity). */
const ELEM = {
  H :{c:[0.88,0.88,0.88], r:0.23, vr:1.10, n:1,  z:1 , en:2.20},   C :{c:[0.24,0.24,0.24], r:0.32, vr:1.70, n:12, z:6 , en:2.55},
  N :{c:[0.19,0.31,0.97], r:0.31, vr:1.55, n:14, z:7 , en:3.04},   O :{c:[0.94,0.15,0.15], r:0.30, vr:1.52, n:16, z:8 , en:3.44},
  S :{c:[1.00,0.78,0.16], r:0.38, vr:1.80, n:32, z:16, en:2.58},   P :{c:[1.00,0.50,0.00], r:0.38, vr:1.80, n:31, z:15, en:2.19},
  MG:{c:[0.33,0.78,0.33], r:0.42, vr:1.73, n:24, z:12, en:1.31},   FE:{c:[0.88,0.40,0.20], r:0.42, vr:1.56, n:56, z:26, en:1.83},
  MN:{c:[0.61,0.48,0.78], r:0.42, vr:1.61, n:55, z:25, en:1.55},   CA:{c:[0.24,0.80,0.24], r:0.46, vr:1.97, n:40, z:20, en:1.00},
  ZN:{c:[0.49,0.51,0.69], r:0.40, vr:1.39, n:65, z:30, en:1.65},   CU:{c:[0.78,0.50,0.20], r:0.40, vr:1.40, n:64, z:29, en:1.90},
  CL:{c:[0.24,0.94,0.24], r:0.36, vr:1.75, n:35, z:17, en:3.16},   NA:{c:[0.67,0.36,0.95], r:0.46, vr:2.27, n:23, z:11, en:0.93},
  K :{c:[0.56,0.25,0.83], r:0.52, vr:2.75, n:39, z:19, en:0.82},   CO:{c:[0.94,0.56,0.63], r:0.42, vr:1.52, n:59, z:27, en:1.88},
  FB:{c:[0.55,0.55,0.55], r:0.32, vr:1.60, n:12, z:6 , en:2.50},
};
const info = code => ELEM[EL_LIST[code]] || ELEM.FB;

/* ── Element registry (symbol ↔ small integer code) ───────────────────── */
const EL_CODE = new Map(), EL_LIST = [];
function codeOf(sybyl){
  const dot = sybyl.indexOf('.');
  let sym = (dot === -1 ? sybyl : sybyl.slice(0, dot)).toUpperCase();
  if(!ELEM[sym]) sym = 'FB';
  let c = EL_CODE.get(sym);
  if(c === undefined){ c = EL_LIST.length; EL_CODE.set(sym, c); EL_LIST.push(sym); }
  return c;
}

const setLbl = t => { const e = document.getElementById('load-lbl'); if(e) e.textContent = t; };
const setBar = v => { const e = document.getElementById('load-bar');
  if(e) e.style.transform = 'scaleX(' + Math.max(0, Math.min(1, v/100)) + ')'; };
const yield_ = () => new Promise(r => setTimeout(r, 0));

/* ── Goodsell-style muted palette, coloured by molecular component ─────── */
const CAT_COLORS = [
  [0.52,0.47,0.27],   // 0 protein     — muted olive/khaki
  [0.30,0.48,0.28],   // 1 chlorophyll — muted green
  [0.86,0.47,0.17],   // 2 carotenoid  — orange
  [0.60,0.22,0.18],   // 3 heme        — rust red
  [0.72,0.63,0.39],   // 4 lipid       — tan
  [0.52,0.55,0.62],   // 5 metal/ion   — slate
  [0.60,0.55,0.44],   // 6 other       — neutral tan
];
const RES_CAT = {};
'ALA ARG ASN ASP CYS GLN GLU GLY HIS ILE LEU LYS MET PHE PRO SER THR TRP TYR VAL HOH'.split(' ').forEach(r=>RES_CAT[r]=0);
'CHL CLA PHO BCL'.split(' ').forEach(r=>RES_CAT[r]=1);
'BCR LUT NEX XAT VIO ZEA ECH'.split(' ').forEach(r=>RES_CAT[r]=2);   // ECH = echinenone (b6f)
'HEM HEC'.split(' ').forEach(r=>RES_CAT[r]=3);
'DGD LMG LHG PL9 SQD LMT 6PL PGV LFA'.split(' ').forEach(r=>RES_CAT[r]=4);   // 6PL/PGV/LFA = b6f phospholipids + fatty acid
'CL FE2 FE MG MN CA NA K ZN OEX BCT CU CO'.split(' ').forEach(r=>RES_CAT[r]=5);
const catOf = res => RES_CAT[res] ?? 6;
// Electron-transport-chain cofactors → flagged so a button can render them on top of everything.
// The FULL light-harvesting + electron-transport set: every chlorophyll (antenna AND reaction-centre —
// P680/P700 can't be told apart from antenna Chl in this data), every carotenoid, the quinones, hemes,
// pheophytins, metal clusters, and Tyr Z (tagged geometrically in markTyrZ — it's a plain TYR residue,
// identified as the one hydrogen-bonded to the OEC).
// Each cofactor residue → a TYPE code (1-9) so the overlay can colour them by role, in vivid hues
// that stand out from the muted parent-model palette.
const ETC_RES = { OEX:1, MN:1, CA:1,   PHO:2,   PL9:3, PQN:3, PQ9:3, UQ:3,   HEM:4, HEC:4,
  SF4:5, FES:5, F3S:5, FE:5, FE2:5,   CU:6,
  CLA:7, CHL:7, BCL:7, CL0:7,                                   // chlorophylls (antenna + reaction centre)
  BCR:8, LUT:8, NEX:8, XAT:8, VIO:8, ZEA:8, LU2:8, A86:8, ECH:8 };   // carotenoids (ECH = echinenone, b6f)
const ETC_TYRZ = 9;                                             // assigned geometrically, not by residue name
const ETC_COL = [ [0,0,0],              // 0 unused
  [1.00,0.52,0.00],   // 1 OEC (Mn₄CaO₅)        — bright orange
  [1.00,0.20,0.72],   // 2 pheophytin           — magenta
  [0.05,0.90,0.92],   // 3 plasto/phyllo-quinone — cyan
  [1.00,0.13,0.13],   // 4 heme                  — vivid red
  [1.00,0.84,0.08],   // 5 Fe-S cluster          — yellow
  [0.28,0.52,1.00],   // 6 Cu (plastocyanin)     — blue
  [0.13,0.95,0.38],   // 7 chlorophyll           — vivid green
  [0.99,0.70,0.22],   // 8 carotenoid            — amber
  [0.74,0.36,1.00] ]; // 9 Tyr Z (D1-Tyr161)     — violet

/* ── Parse a multi-molecule mol2 into typed-array records ──────────────── */
function parseMol2(text){
  const lines = text.split('\n');
  const mols = [];
  let cur = null, section = '';
  for(let i = 0; i < lines.length; i++){
    const ln = lines[i];
    if(ln.charCodeAt(0) === 64){                 // '@' → section marker
      const t = ln.trim();
      if(t === '@<TRIPOS>MOLECULE'){ cur = {name:null}; mols.push(cur); section = 'HDR'; }
      else if(t === '@<TRIPOS>ATOM')  section = 'ATOM';
      else if(t === '@<TRIPOS>BOND')  section = 'BOND';
      else section = 'OTHER';
      continue;
    }
    if(section === 'HDR'){
      if(cur.name === null){ cur.name = ln.trim(); }
      else if(cur.na === undefined){
        const p = ln.trim().split(/\s+/);
        cur.na = +p[0]; cur.nb = +p[1] || 0;
        cur.x  = new Float32Array(cur.na); cur.y = new Float32Array(cur.na);
        cur.z  = new Float32Array(cur.na); cur.el = new Uint16Array(cur.na); cur.ai = 0;
        cur.cat = new Uint8Array(cur.na);
        cur.cof = new Uint8Array(cur.na);  // 1 = electron-transport-chain cofactor (for the render-on-top overlay)
        cur.sid = new Int32Array(cur.na);  // subst_id (residue instance) → to extract one chlorophyll
        cur.tyr = new Uint8Array(cur.na);  // 1 = atom of a TYR residue → markTyrZ picks the one beside the OEC
        cur.b1 = new Int32Array(cur.nb);   cur.b2 = new Int32Array(cur.nb);  cur.bi = 0;
        cur.bo = new Uint8Array(cur.nb);   // bond order (1 single, 2 double, 3 triple)
      }
      continue;
    }
    if(section === 'ATOM'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 6 || cur.ai >= cur.na) continue;
      const k = cur.ai++;
      cur.x[k] = +p[2]; cur.y[k] = +p[3]; cur.z[k] = +p[4]; cur.el[k] = codeOf(p[5]);
      cur.cat[k] = catOf(p[7] || ''); cur.sid[k] = +p[6] || 0; cur.cof[k] = ETC_RES[p[7]] || 0;   // 0 = not a cofactor, else type code 1-9
      if(p[7] === 'TYR') cur.tyr[k] = 1;
    } else if(section === 'BOND'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 4 || cur.bi >= cur.nb) continue;
      const k = cur.bi++;
      cur.b1[k] = (+p[1]) - 1; cur.b2[k] = (+p[2]) - 1;
      cur.bo[k] = p[3]==='2' ? 2 : p[3]==='3' ? 3 : 1;   // double / triple / (single, aromatic, amide → 1)
    }
  }
  return mols.filter(m => m.na > 0);
}

/* Tyr Z (D1-Tyr161) — the redox-active tyrosine that ferries electrons from the OEC to P680⁺.
   The mol2 carries no chain id or PDB numbering, so name-matching can't find it; instead we use the
   geometry that DEFINES it: it is the one tyrosine hydrogen-bonded to the Mn₄CaO₅ cluster (~5 Å).
   Tyr D, its pseudo-symmetric twin on D2, sits ~30 Å from any Mn and is correctly left unmarked.
   A dimer simply yields one Tyr Z per monomer. Marks every atom of each matching TYR residue. */
function markTyrZ(m){
  if(!m.tyr || !m.cof) return;
  const oi=[];                                                 // OEC atom indices (Mn/Ca/O of the cluster)
  for(let k=0;k<m.na;k++) if(m.cof[k]===1) oi.push(k);
  if(!oi.length) return;                                       // no OEC in this model → no Tyr Z
  // Split the OEC atoms into clusters (one per PSII monomer) by single-linkage within 6 Å.
  const cid = new Array(oi.length).fill(-1); let nc = 0;
  for(let a=0;a<oi.length;a++){
    if(cid[a] >= 0) continue;
    cid[a] = nc; const stack=[a];
    while(stack.length){ const p=stack.pop(), pk=oi[p];
      for(let b=0;b<oi.length;b++){ if(cid[b]>=0) continue; const bk=oi[b];
        const dx=m.x[pk]-m.x[bk], dy=m.y[pk]-m.y[bk], dz=m.z[pk]-m.z[bk];
        if(dx*dx+dy*dy+dz*dz < 36){ cid[b]=nc; stack.push(b); } } }
    nc++;
  }
  // Per cluster, the SINGLE closest tyrosine is Tyr Z (its OH hydrogen-bonds the cluster, ~5 Å).
  // Tyr D, the pseudo-symmetric twin on D2, is ~30 Å away and never wins.
  const best = new Array(nc).fill(-1), bestD = new Array(nc).fill(Infinity);
  const resMin = new Map();                                    // residue id → [minDist², cluster]
  for(let k=0;k<m.na;k++){
    if(!m.tyr[k]) continue;
    for(let a=0;a<oi.length;a++){ const ok=oi[a];
      const dx=m.x[k]-m.x[ok], dy=m.y[k]-m.y[ok], dz=m.z[k]-m.z[ok], d2=dx*dx+dy*dy+dz*dz;
      const cur = resMin.get(m.sid[k]);
      if(!cur || d2 < cur[0]) resMin.set(m.sid[k], [d2, cid[a]]);
    }
  }
  // Only a REAL Mn₄CaO₅ cluster counts — lone Mn/Ca ions elsewhere in the structure form their own
  // 1-2 atom "clusters" and would each drag in a spurious nearby tyrosine.
  const csize = new Array(nc).fill(0); for(const c of cid) csize[c]++;
  for(const [sid, v] of resMin){ const [d2, c] = v;
    if(csize[c] >= 4 && d2 < 100 && d2 < bestD[c]){ bestD[c] = d2; best[c] = sid; } }   // within 10 Å, nearest wins
  const hit = new Set(best.filter(s => s >= 0));
  if(!hit.size) return;
  for(let k=0;k<m.na;k++) if(m.tyr[k] && hit.has(m.sid[k])) m.cof[k] = ETC_TYRZ;
}

/* Pull one complete chlorophyll (CLA/CHL/PHO residue) out of the model as its own molecule. */
function extractChlorophyll(m){
  if(!m.sid) return null;
  const groups = new Map();                      // group chlorophyll atoms by residue id
  for(let k=0;k<m.na;k++) if(m.cat[k]===1){
    const g = groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k], [k]);
  }
  let best = null;
  for(const g of groups.values()) if(!best || g.length > best.length) best = g;   // the largest = a full chlorophyll
  if(!best || best.length < 20) return null;
  const na = best.length, map = new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const nm = { name:'Chlorophyll', na, ai:na, nb:0,
    x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na),
    el:new Uint16Array(na), cat:new Uint8Array(na), sid:new Int32Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li];
    nm.x[li]=m.x[gi]; nm.y[li]=m.y[gi]; nm.z[li]=m.z[gi]; nm.el[li]=m.el[gi]; nm.cat[li]=m.cat[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  nm.nb=b1.length; nm.b1=Int32Array.from(b1); nm.b2=Int32Array.from(b2); nm.bo=Uint8Array.from(bo);
  return nm;
}

/* Pull one lipid molecule (category 4) out of the model → atoms AND its internal bonds
   (the bonds are needed to build the same hybridised σ/π/lone-pair lobes as the protein). */
function extractLipid(m){
  if(!m.sid) return null;
  const groups = new Map();
  for(let k=0;k<m.na;k++) if(m.cat[k]===4){ const g=groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k],[k]); }
  let best=null;
  for(const g of groups.values()) if(!best || g.length>best.length) best=g;   // largest = a complete lipid
  if(!best || best.length < 30) return null;
  const na=best.length, map=new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const out={ na, nb:0, x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na), el:new Uint16Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li]; out.x[li]=m.x[gi]; out.y[li]=m.y[gi]; out.z[li]=m.z[gi]; out.el[li]=m.el[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  out.nb=b1.length; out.b1=Int32Array.from(b1); out.b2=Int32Array.from(b2); out.bo=Uint8Array.from(bo);
  return out;
}

precision highp float;
uniform mat4 projection;
uniform float bubbleR;
uniform float uT;

uniform float focusId;
uniform float coneCos;
uniform float depthBias;

  // around the ring) rises with orbital energy — the moving, phase-shifting ripple, not a static bloom.
  float m = 3.0 + fr * 9.0;

  float travel = 0.6 + 0.4*sin(ang*m - uT*4.0 + rad*6.0);   // bright crests march AROUND the circle

    sin(uT*0.91 + s*1.7) + 0.7*sin(uT*1.29 + s*0.6),

/* ── Fetch + parse + build a mol2 file, then render it ─────────────────── */
async function run(){
  /* ── Thylakoid membrane scene ─────────────────────────────────────────────
     Integral complexes are embedded in the bilayer (Y≈0) in electron-transport order
     along X; soluble partners sit on the stroma (+Y) or lumen (−Y) face beside their
     functional partner. x = position along the membrane, y = 0 membrane / + stroma /
     − lumen, z = depth into the membrane plane. */
  const MEMBRANE_Y = 0;
  // Filenames now match their content, but complexes are still identified by their INTERNAL name /
  // PDB-or-AlphaFold code (robust regardless of filename).
  // x = along the membrane, y = 0 membrane / + stroma / − lumen, z = depth into the plane.
  const MODELS = [
    {match:'3jcu',   x:-560, y:0,    z:0,    rot:[54,-171,-180], label:'Photosystem II'},
    {match:'7r0w',   x:-190, y:0,    z:58,   rot:[81,79,-180], label:'Cytochrome b6f'},
    {match:'9e0j',   x:460,  y:0,    z:0,    rot:[-77,132,-130], label:'Photosystem I'},
    {match:'6l7o',   x:97,   y:35,   z:30,   rot:[51,-159,70],   label:'NDH-1'},
    {match:'6vm1',   x:760,  y:84,   z:0,    rot:[-69,102,33],   label:'ATP synthase'},
    {match:'1ag6',   x:-10,  y:-190, z:0,    label:'Plastocyanin'},
    {match:'q39249', x:-600, y:-190, z:10,   label:'Violaxanthin de-epoxidase'},
    {match:'1a70',   x:230,  y:250,  z:20,   label:'Ferredoxin'},
    {match:'1gjr',   x:400,  y:290,  z:80,   label:'FNR'},
    {match:'1rcx',   x:600,  y:380,  z:-80,  label:'RuBisCO'},
    {match:'q9sl05', x:-40,  y:220,  z:90,   label:'PGR5'},
    {match:'q8h112', x:30,   y:185,  z:-90,  label:'PGRL1'},
    {match:'q9s713', x:-360, y:230,  z:90,   label:'STN7'},
    {match:'4yzg',   x:-470, y:220,  z:-80,  label:'PPH1'},
    {match:'q9fgc7', x:-640, y:230,  z:0,    label:'Zeaxanthin epoxidase'},

  const FILES = ['PSII.mol2','photosystem_I.mol2','cytochrome_b6f.mol2','ATP_synthase.mol2','NDH-1.mol2',
    'ferredoxin.mol2','FNR.mol2','RuBisCO.mol2','plastocyanin.mol2','PGR5.mol2',
    'PGRL1.mol2','PPH1.mol2','STN7.mol2','Violaxanthin_de-epoxidase.mol2','Zeaxanthin_epoxidase.mol2'];
  const barEl = document.getElementById('load-bar');
  setLbl('Fetching thylakoid models…');
  const mols = [];
  for(let i=0;i<FILES.length;i++){ const fn=FILES[i];
    setLbl(`Fetching ${fn}…`); setBar((i/FILES.length)*45);
    try{
      const res = await fetch('./'+fn);
      if(!res.ok){ console.warn('skip (HTTP '+res.status+')', fn); continue; }
      const ab = await res.arrayBuffer();
      const parsed = parseMol2(new TextDecoder().decode(new Uint8Array(ab)));
      for(const m of parsed){ if(m.na<=0) continue;
        const nm = (m.name||'').toLowerCase();
        const cfg = MODELS.find(e => !e._used && nm.includes(e.match));   // match by internal name/code
        if(!cfg){ console.log('unmatched molecule "'+m.name+'" in '+fn+' (skipped)'); continue; }
        cfg._used = true; cfg.file = fn; m.cfg = cfg; m.name = cfg.label;
        markTyrZ(m);                                   // tag the OEC-adjacent tyrosine as Tyr Z (needs raw, pre-transform coords)
        mols.push(m); }
    }catch(err){ console.warn('failed to load', fn, err); }
    await yield_();
  }
  if(mols.length === 0) throw new Error('No models loaded — are the .mol2 files next to index.html?');
  setLbl('Placing complexes…'); await yield_();
  const psii = mols.find(m => m.cfg && m.cfg.match==='3jcu') || mols[0];
  const chl = extractChlorophyll(psii);          // one chlorophyll extracted from PSII, animated
  const lipid = extractLipid(psii);              // one lipid → tiled into the bilayer

  // Rotate every model 90° about Z (as before) so complexes stand upright-ish across the membrane.
  for(const m of mols){ for(let k=0;k<m.na;k++){ const x=m.x[k], y=m.y[k]; m.x[k]=y; m.y[k]=-x; } }
  if(chl){ for(let k=0;k<chl.na;k++){ const x=chl.x[k], y=chl.y[k]; chl.x[k]=y; chl.y[k]=-x; }
    chl.cfg = {x:-560, y:150, z:130}; chl.name = 'Chlorophyll'; mols.push(chl); }

  // Cytochrome b6f (7r0w) is already the physiological HOMODIMER in the file — no clone needed.

  // Bake per-model rotation (Euler degrees rx,ry,rz read off the gizmo label) around each model's
  // centroid, so the orientation persists. Uses Babylon's YawPitchRoll(y,x,z) — the inverse of
  // the label's toEulerAngles(), so the numbers reproduce exactly.
  { const D = Math.PI/180, _R = new BABYLON.Matrix(), _v = new BABYLON.Vector3();
    for(const m of mols){ const rot = m.cfg && m.cfg.rot; if(!rot) continue;
      BABYLON.Quaternion.RotationYawPitchRoll(rot[1]*D, rot[0]*D, rot[2]*D).toRotationMatrix(_R);
      let cx=0,cy=0,cz=0; for(let k=0;k<m.na;k++){ cx+=m.x[k]; cy+=m.y[k]; cz+=m.z[k]; } cx/=m.na; cy/=m.na; cz/=m.na;
      for(let k=0;k<m.na;k++){ _v.set(m.x[k]-cx, m.y[k]-cy, m.z[k]-cz);

  if(barEl){ barEl.style.transition = 'transform 6s cubic-bezier(0.15,0.75,0.2,1)'; barEl.style.transform = 'scaleX(0.9)'; }
  const box = [];
  for(const m of mols){
    let miX=Infinity,miY=Infinity,miZ=Infinity,maX=-Infinity,maY=-Infinity,maZ=-Infinity;
    for(let k=0;k<m.na;k++){ const x=m.x[k],y=m.y[k],z=m.z[k];

    box.push({miX,miY,miZ,maX,maY,maZ,w:maX-miX});
    const cx=(miX+maX)/2, cy=(miY+maY)/2, cz=(miZ+maZ)/2, cfg=m.cfg||{x:0,y:0,z:0};

      if(EL_LIST[e2]!=='H'){ oidH2 = 1000 + hybCnt[e2][ai2]++; halfLobe(x2,y2,z2, x2-bx*f,y2-by*f,z2-bz*f, x2,y2,z2, undefined, w2, e2, ai2, oidH2); }

        const mx=(x1+x2)/2, my=(y1+y2)/2, mz=(z1+z2)/2;

    return mat;
  };
  const impostorMat = (name, radius, isShell, protonOutline, movable) => {

    BABYLON.Animation.CreateAndStartAnimation('centerR', cam, 'radius', 60, 22,       // keep scale
      cam.radius, keepR, BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT, ease);
  };
  // Double-click an atom → focus it; double-click empty space → swing perpendicular to the spawn plane.
  // Double-click → select the nearest complex for moving (gizmo + live coord label).
  // DOUBLE-click is the only thing that SELECTS. Same three range tiers as before: CLOSE → the atom,
  // MEDIUM → the whole ETC cofactor, FAR → the whole complex; empty space clears + swings perpendicular.
  const onDouble = () => {
    if(spawnEl) return;
    const a = pickAtom();
    if(a){ clearEtcSel(); centerOnAtom(a); return; }
    const gi = pickEtcGroup();
    if(gi >= 0){ clearAtomSel(); deselectModel(); showEtcSel(gi); return; }
    // Whole-complex selection (→ move/rotate gizmo) is a DEV-mode tool only.
    if(gDev){ const mid = pickModelAtCursor();
      if(mid >= 0 && _modelPickT > BUBBLE_R){ clearAtomSel(); clearEtcSel(); selectModel(mid); return; } }
    clearAtomSel(); clearEtcSel(); deselectModel(); viewPerp();
  };
  canvas.addEventListener('dblclick', onDouble);                                    // desktop
  scene.onPointerObservable.add(p => {
    if(p.type === BABYLON.PointerEventTypes.POINTERDOUBLETAP){ onDouble(); return; }        // touch double-tap
    if(p.type === BABYLON.PointerEventTypes.POINTERMOVE){                                   // hover highlight
      const now = performance.now();
      if(dragging || p.event.buttons || now - hoverT < 80) return;   // skip while any button held; throttle
      hoverT = now;
      if(wholeInView()){ macroHover(); hl.setEnabled(false); return; }   // zoomed out → hover the whole protein (white box), not atoms
      if(gMacroHover){ gMacroHover=false; if(!gMacroSel) setOutline(false); }
      const a = pickAtom();
      // don't hover-outline the atom that's already selected → its selOut is enough (no doubled stroke)
      if(a && BABYLON.Vector3.DistanceSquared(a.center, selCenter) > 0.09) setHL(a);
      else hl.setEnabled(false);   // white stroke exactly on each orbital + bonding lobe
    }
  });

  /* Floating per-model labels (multi-molecule files only) */
  const labels = [];   // floating model name-tags removed (per request)
  scene.registerAfterRender(() => {
    const vp = cam.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight());
    const tm = scene.getTransformMatrix();
    for(const el of labels){
      const p = BABYLON.Vector3.Project(el.pos, BABYLON.Matrix.Identity(), tm, vp);
      const vis = p.z>0 && p.z<1;
      el.style.display = vis ? 'block' : 'none';
      if(vis){ el.style.left=(p.x-el.offsetWidth/2)+'px'; el.style.top=(p.y-el.offsetHeight-4)+'px'; }
    }
  });

  if(barEl){ barEl.style.transition = 'transform 0.25s ease-out'; barEl.style.transform = 'scaleX(1)'; }
  document.getElementById('overlay').classList.add('gone');

  // AO is disabled in the translucent "inside" view — it packs depth into the alpha
  // channel, which the transparent shell now uses for blending (the two can't coexist).
  // FXAA + supersampling still smooth the edges.
  new BABYLON.FxaaPostProcess('fxaa', 1.0, cam);
  // Painterly / comic-book grade — runs last, over the anti-aliased frame. Toggle with "P".
  let painterlyOn = true;
  const painterly = new BABYLON.PostProcess('painterly', 'painterly',
    ['texel', 'edgeAmt', 'bands', 'paperAmt', 'bright'], null, 1.0, cam);
  painterly.onApply = eff => {
    eff.setFloat2('texel', 1 / engine.getRenderWidth(), 1 / engine.getRenderHeight());
    eff.setFloat('edgeAmt', 1.5);    // ink line strength
    eff.setFloat('bands', 6.0);      // flat colour bands per channel
    eff.setFloat('paperAmt', 0.05);  // paper grain
    eff.setFloat('bright', 1.35);    // brightness lift (was coming out dark)
  };
  window.addEventListener('keydown', e => {
    if(e.key === 'p' || e.key === 'P'){
      painterlyOn = !painterlyOn;
      if(painterlyOn) cam.attachPostProcess(painterly); else cam.detachPostProcess(painterly);
    }
  });
  /* ── WebXR / VR ─────────────────────────────────────────────────────────
     Enter VR with our palette VR button. Quest-3 control scheme (free flight,
     no floor anchor — reference space is 'local'):
       • RIGHT thumbstick → FLY toward where the headset is looking. Y =
         forward/back along the full gaze (look up & push to ascend), X = strafe.
       • LEFT  thumbstick → X = turn (rotate the view); Y = rise / descend.
       • grip / squeeze   → speed boost while held.
     Rotation runs through Babylon's built-in movement feature because a turn
     has to rotate the WebXR reference space — a camera rotation set by hand
     would be overwritten by the headset pose every frame. Its own movement
     is disabled; we translate the camera ourselves for full 6-DOF flight.
     Teleportation is off. */
  try {
    // Only offer VR when the browser actually exposes an immersive-VR device (e.g. the Quest browser).
    const vrOK = navigator.xr && await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
    if (vrOK) {
      // disableDefaultUI: we drive entry from our own big "VR" button instead of Babylon's tiny goggles icon.
      const xr = await scene.createDefaultXRExperienceAsync({ disableTeleportation: true, disableDefaultUI: true });
      if (xr && xr.baseExperience) {
        const fm = xr.baseExperience.featuresManager;
        // ── VR performance ──────────────────────────────────────────────────
        // A screen-space post-process (painterly) doesn't map onto the stereo eye buffers, and the
        // heavy scene can push the Quest into reprojection — both show up as lag AND dark borders at
        // the edges of the view. While in VR: drop the post-process, render at a lighter resolution,
        // and turn on fixed foveation (cheap periphery). Everything is restored on exit.
        xr.baseExperience.onStateChangedObservable.add(state => {
          if (state === BABYLON.WebXRState.IN_XR) {
            try { cam.detachPostProcess(painterly); } catch (e) {}
            engine.setHardwareScalingLevel(1.4);   // ~50% fewer pixels → big GPU win, keeps framerate up
            try {
              const bl = xr.baseExperience.sessionManager.session.renderState.baseLayer;
              if (bl && 'fixedFoveation' in bl) bl.fixedFoveation = 1;   // max foveation → cheap periphery
            } catch (e) {}
          } else if (state === BABYLON.WebXRState.NOT_IN_XR) {
            engine.setHardwareScalingLevel(1);
            if (painterlyOn) { try { cam.attachPostProcess(painterly); } catch (e) {} }
          }
        });
        // Reveal our palette button and wire it to enter/exit VR.
        const vrBtn = document.getElementById('vr-btn');
        if (vrBtn) {
          vrBtn.style.display = '';
          vrBtn.addEventListener('click', async () => {
            try {
              if (xr.baseExperience.state === BABYLON.WebXRState.IN_XR) await xr.baseExperience.exitXRAsync();
              else await xr.baseExperience.enterXRAsync('immersive-vr', 'local');   // 'local' (not 'local-floor') → free flight, no floor anchor
            } catch (e) { setLbl('VR-tilaan siirtyminen epäonnistui: ' + (e && e.message)); }
          });
        }
        try { fm.disableFeature(BABYLON.WebXRFeatureName.TELEPORTATION); } catch (e) {}

        const TH = BABYLON.WebXRControllerComponent.THUMBSTICK_TYPE;   // 'thumbstick'
        // Built-in feature: LEFT-stick rotation only (movement handled manually below).
        fm.enableFeature(BABYLON.WebXRFeatureName.MOVEMENT, 'latest', {
          xrInput: xr.input,
          movementEnabled: false,
          rotationEnabled: true,
          rotationSpeed: 0.20,
          rotationThreshold: 0.15,
          customRegistrationConfigurations: [
            { allowedComponentTypes: [TH], forceHandedness: 'left',
              axisChangedHandler: (axes, st) => { st.rotateX = axes.x; } },   // left stick = turn
          ],
        });

        // Manual RIGHT-stick FLIGHT (full 6-DOF) + optional LEFT-stick vertical + grip boost.
        let rightStick = null, leftStick = null;
        const gripState = { left: 0, right: 0 };
        xr.input.onControllerAddedObservable.add(ctrl => {
          ctrl.onMotionControllerInitObservable.add(mc => {
            const stick = mc.getComponent('xr-standard-thumbstick');
            if (mc.handedness === 'right') rightStick = stick || rightStick;
            else                           leftStick  = stick || leftStick;
            const grip = mc.getComponent('xr-standard-squeeze');
            if (grip) grip.onButtonStateChangedObservable.add(c => { gripState[mc.handedness] = c.value; });
          });
        });

        const BASE = 5;      // units/frame at the sheet's scale (~300 u/s)
        const DEAD = 0.15;
        const fwd = new BABYLON.Vector3(), rgt = new BABYLON.Vector3();
        const UP = new BABYLON.Vector3(0, 1, 0);
        scene.onBeforeRenderObservable.add(() => {
          if (xr.baseExperience.state !== BABYLON.WebXRState.IN_XR) return;
          const camXR = xr.baseExperience.camera;
          const step = BASE * (1 + 5 * Math.max(gripState.left, gripState.right));   // grip → up to 6×
          // Right stick = FLY toward where the headset looks (pitch INCLUDED → look up & push to ascend).
          if (rightStick) {
            const ax = rightStick.axes;
            if (Math.abs(ax.x) > DEAD || Math.abs(ax.y) > DEAD) {
              camXR.getDirectionToRef(BABYLON.Axis.Z, fwd);   // full gaze direction (no y-lock → free flight)
              camXR.getDirectionToRef(BABYLON.Axis.X, rgt);
              camXR.position.addInPlace(fwd.scale(-ax.y * step));   // stick up = forward (fly up when looking up)
              camXR.position.addInPlace(rgt.scale( ax.x * step));   // strafe
            }
          }
          // Left stick Y = straight up / down (rotation X is handled by the built-in feature).
          if (leftStick && Math.abs(leftStick.axes.y) > DEAD) {
            camXR.position.addInPlace(UP.scale(-leftStick.axes.y * step));   // push up = rise
          }
        });
      }
    }
  } catch (e) { console.warn('WebXR unavailable:', e && e.message); }

  engine.runRenderLoop(() => scene.render());
  window.addEventListener('resize', () => engine.resize());
}

/* ── Auto-load PSII on page load (no prompt) ───────────────────────────── */
run().catch(err => {
  console.error(err);
  setLbl('Error: ' + err.message);
});
</script>
</body>
</html>
