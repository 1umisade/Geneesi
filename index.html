      if(overAtom){   // CLOSE → hover the ATOM (same tier as selecting)
        // don't hover-outline the atom that's already selected → its selOut is enough (no doubled stroke)
        if(BABYLON.Vector3.DistanceSquared(a.center, selCenter) > 0.09) setHL(a); else hl.setEnabled(false);
        gHoverGroup = -1;                                                  // not hovering a whole cofactor
      } else {                                                            // FAR → hover the whole MOLECULE (cofactor) → it renders 25% brighter
        hl.setEnabled(false);
        const gi = pickEtcGroup();
        gHoverGroup = gi >= 0 ? gi : -1;                                  // brighten the hovered cofactor group (no outline)
      }
    }
  });

  /* Floating per-model labels (multi-molecule files only) */
  const labels = [];   // floating model name-tags removed (per request)
  scene.registerAfterRender(() => {
    const vp = cam.viewport.toGlobal(engine.getRenderWidth(), engine.getRenderHeight());
    const tm = scene.getTransformMatrix();
    for(const el of labels){
      const p = BABYLON.Vector3.Project(el.pos, BABYLON.Matrix.Identity(), tm, vp);
      const vis = p.z>0 && p.z<1;
      el.style.display = vis ? 'block' : 'none';
      if(vis){ el.style.left=(p.x-el.offsetWidth/2)+'px'; el.style.top=(p.y-el.offsetHeight-4)+'px'; }
    }
  });

  if(barEl){ barEl.style.transition = 'transform 0.25s ease-out'; barEl.style.transform = 'scaleX(1)'; }
  document.getElementById('overlay').classList.add('gone');

  // Silhouette pass — runs FIRST, on the RAW scene (background is the exact flat colour). Inks a black
  // outline where the frame meets the background (the whole assembly) AND around each cofactor molecule
  // (from the coverage mask). fxaa + the painterly grade then blend it into the comic look.
  const cofsil = new BABYLON.PostProcess('cofsil', 'cofsil', ['texel','lineW','bgRef'], ['cofMask'], 1.0, cam);
  cofsil.onApply = eff => {
    eff.setFloat2('texel', 1/engine.getRenderWidth(), 1/engine.getRenderHeight());
    eff.setFloat('lineW', gCofLineW);
    eff.setColor3('bgRef', BG_GREEN);
    if(cofMaskRT) eff.setTexture('cofMask', cofMaskRT);
  };
  // AO is disabled in the translucent "inside" view — it packs depth into the alpha
  // channel, which the transparent shell now uses for blending (the two can't coexist).
  // FXAA + supersampling still smooth the edges.
  new BABYLON.FxaaPostProcess('fxaa', 1.0, cam);
  // Global brightness (dev "lighting" slider) — a simple per-pixel multiply on the finished frame.
  const brightPP = new BABYLON.PostProcess('bright', 'bright', ['bright','contrast'], null, 1.0, cam);
  brightPP.onApply = eff => { eff.setFloat('bright', gBright);
    eff.setFloat('contrast', 1.0 + Math.max(0.0, 1.0 - gBright) * 1.2); };   // dimmer → punchier (no wash-out)
  // Painterly / comic-book grade — runs last, over the anti-aliased frame. Toggle with "P".
  let painterlyOn = true;
  const painterly = new BABYLON.PostProcess('painterly', 'painterly',
    ['texel', 'edgeAmt', 'bands', 'paperAmt', 'bright'], null, 1.0, cam);
  painterly.onApply = eff => {
    eff.setFloat2('texel', 1 / engine.getRenderWidth(), 1 / engine.getRenderHeight());
    eff.setFloat('edgeAmt', 1.5);    // ink line strength
    eff.setFloat('bands', 6.0);      // flat colour bands per channel
    eff.setFloat('paperAmt', 0.05);  // paper grain
    eff.setFloat('bright', 1.35);    // brightness lift (was coming out dark)
  };
  window.addEventListener('keydown', e => {
    if(e.key === 'p' || e.key === 'P'){
      painterlyOn = !painterlyOn;
      if(painterlyOn) cam.attachPostProcess(painterly); else cam.detachPostProcess(painterly);
    }
  });
  /* ── WebXR / VR ─────────────────────────────────────────────────────────
     Enter VR with our palette VR button. Quest-3 control scheme (free flight,
     no floor anchor — reference space is 'local'):
       • RIGHT thumbstick → FLY toward where the headset is looking. Y =
         forward/back along the full gaze (look up & push to ascend), X = strafe.
       • LEFT  thumbstick → X = turn (rotate the view); Y = rise / descend.
       • grip / squeeze   → speed boost while held.
     Rotation runs through Babylon's built-in movement feature because a turn
     has to rotate the WebXR reference space — a camera rotation set by hand
     would be overwritten by the headset pose every frame. Its own movement
     is disabled; we translate the camera ourselves for full 6-DOF flight.
     Teleportation is off. */
  try {
    // Only offer VR when the browser actually exposes an immersive-VR device (e.g. the Quest browser).
    const vrOK = navigator.xr && await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
    if (vrOK) {
      // disableDefaultUI: we drive entry from our own big "VR" button instead of Babylon's tiny goggles icon.
      const xr = await scene.createDefaultXRExperienceAsync({ disableTeleportation: true, disableDefaultUI: true });
      if (xr && xr.baseExperience) {
        const fm = xr.baseExperience.featuresManager;
        // ── VR performance ──────────────────────────────────────────────────
        // A screen-space post-process (painterly) doesn't map onto the stereo eye buffers, and the
        // heavy scene can push the Quest into reprojection — both show up as lag AND dark borders at
        // the edges of the view. While in VR: drop the post-process, render at a lighter resolution,
        // and turn on fixed foveation (cheap periphery). Everything is restored on exit.
        xr.baseExperience.onStateChangedObservable.add(state => {
          if (state === BABYLON.WebXRState.IN_XR) {
            try { cam.detachPostProcess(painterly); } catch (e) {}
            engine.setHardwareScalingLevel(1.4);   // ~50% fewer pixels → big GPU win, keeps framerate up
            try {
              const bl = xr.baseExperience.sessionManager.session.renderState.baseLayer;
              if (bl && 'fixedFoveation' in bl) bl.fixedFoveation = 1;   // max foveation → cheap periphery
            } catch (e) {}
          } else if (state === BABYLON.WebXRState.NOT_IN_XR) {
            engine.setHardwareScalingLevel(1);
            if (painterlyOn) { try { cam.attachPostProcess(painterly); } catch (e) {} }
          }
        });
        // Reveal our palette button and wire it to enter/exit VR.
        const vrBtn = document.getElementById('vr-btn');
        if (vrBtn) {
          vrBtn.style.display = '';
          vrBtn.addEventListener('click', async () => {
            try {
              if (xr.baseExperience.state === BABYLON.WebXRState.IN_XR) await xr.baseExperience.exitXRAsync();
              else await xr.baseExperience.enterXRAsync('immersive-vr', 'local');   // 'local' (not 'local-floor') → free flight, no floor anchor
            } catch (e) { setLbl('VR-tilaan siirtyminen epäonnistui: ' + (e && e.message)); }
          });
        }
        try { fm.disableFeature(BABYLON.WebXRFeatureName.TELEPORTATION); } catch (e) {}

        const TH = BABYLON.WebXRControllerComponent.THUMBSTICK_TYPE;   // 'thumbstick'
        // Built-in feature: LEFT-stick rotation only (movement handled manually below).
        fm.enableFeature(BABYLON.WebXRFeatureName.MOVEMENT, 'latest', {
          xrInput: xr.input,
          movementEnabled: false,
          rotationEnabled: true,
          rotationSpeed: 0.20,
          rotationThreshold: 0.15,
          customRegistrationConfigurations: [
            { allowedComponentTypes: [TH], forceHandedness: 'left',
              axisChangedHandler: (axes, st) => { st.rotateX = axes.x; } },   // left stick = turn
          ],
        });

        // Manual RIGHT-stick FLIGHT (full 6-DOF) + optional LEFT-stick vertical + grip boost.
        let rightStick = null, leftStick = null;
        const gripState = { left: 0, right: 0 };
        xr.input.onControllerAddedObservable.add(ctrl => {
          ctrl.onMotionControllerInitObservable.add(mc => {
            const stick = mc.getComponent('xr-standard-thumbstick');
            if (mc.handedness === 'right') rightStick = stick || rightStick;
            else                           leftStick  = stick || leftStick;
            const grip = mc.getComponent('xr-standard-squeeze');
            if (grip) grip.onButtonStateChangedObservable.add(c => { gripState[mc.handedness] = c.value; });
          });
        });

        const BASE = 5;      // units/frame at the sheet's scale (~300 u/s)
        const DEAD = 0.15;
        const fwd = new BABYLON.Vector3(), rgt = new BABYLON.Vector3();
        const UP = new BABYLON.Vector3(0, 1, 0);
        scene.onBeforeRenderObservable.add(() => {
          if (xr.baseExperience.state !== BABYLON.WebXRState.IN_XR) return;
          const camXR = xr.baseExperience.camera;
          const step = BASE * (1 + 5 * Math.max(gripState.left, gripState.right));   // grip → up to 6×
          // Right stick = FLY toward where the headset looks (pitch INCLUDED → look up & push to ascend).
          if (rightStick) {
            const ax = rightStick.axes;
            if (Math.abs(ax.x) > DEAD || Math.abs(ax.y) > DEAD) {
              camXR.getDirectionToRef(BABYLON.Axis.Z, fwd);   // full gaze direction (no y-lock → free flight)
              camXR.getDirectionToRef(BABYLON.Axis.X, rgt);
              camXR.position.addInPlace(fwd.scale(-ax.y * step));   // stick up = forward (fly up when looking up)
              camXR.position.addInPlace(rgt.scale( ax.x * step));   // strafe
            }
          }
          // Left stick Y = straight up / down (rotation X is handled by the built-in feature).
          if (leftStick && Math.abs(leftStick.axes.y) > DEAD) {
            camXR.position.addInPlace(UP.scale(-leftStick.axes.y * step));   // push up = rise
          }
        });
      }
    }
  } catch (e) { console.warn('WebXR unavailable:', e && e.message); }

  // ── Performance note: the SAFE global flags are set up front (engine.enableOfflineSupport=false,
  //    scene.skipPointerMovePicking=true). We deliberately do NOT use scene.freezeActiveMeshes()
  //    (the cull loop enables/disables cells every frame), material.freeze() (shader uniforms are pushed
  //    every frame via onBind), scene.blockMaterialDirtyMechanism (it stalled late vdW-shader compilation
  //    → blank scene), or freezeWorldMatrix() on the cells — every one of those breaks this scene's
  //    dynamic culling / deferred shader compilation.
  engine.runRenderLoop(() => scene.render());
  window.addEventListener('resize', () => engine.resize());
  // Scene is live now (vdW spheres visible). Fill in the rest in the background so the load no longer
  // blocks for ~11s up front: first the lipid membrane (also visible in vdW mode, fills in block-by-
  // block), then the atomic detail (nucleons / orbitals / bond + lone-pair lobes) that only shows in
  // orbital mode or up close. Both stream in over many frames while the scene stays interactive.
  Promise.resolve()
    .then(() => buildMembrane && buildMembrane())
    .then(() => buildDetail && buildDetail())
    .catch(e => console.warn('background build failed:', e));
}

/* ── Auto-load PSII on page load (no prompt) ───────────────────────────── */
run().catch(err => {
  console.error(err);
  setLbl('Error: ' + err.message);
});
</script>
</body>
</html>
