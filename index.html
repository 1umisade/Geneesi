<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mol2 molecule viewer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0e2215}   /* static dark green (the scene draws its own dark-green bg on top) */
#c{width:100%;height:100%;display:block;touch-action:none;cursor:url('./cursor_normal.png') 3 3, auto}
/* ── Solukko palette: dark brown, beige/paper, light green/sage — cartoony & round ── */
:root{
  --paper:#f2e6c9; --paper2:#e7d4ac; --brown:#4a3320; --ink:#3a2716;
  --sage:#a3b881; --sage2:#82a058; --sageink:#2f3d1c;
}
body.dark-mode{
  --paper:#3a2c1c; --paper2:#2d2113; --brown:#7c5c39; --ink:#f0e2c4;
  --sage:#88a35f; --sage2:#a6bd7d; --sageink:#f1f5e2;
}
#overlay{position:absolute;inset:0;z-index:20;display:flex;
  align-items:center;justify-content:center;background:#f2e6c9;transition:opacity .8s}
#overlay.gone{opacity:0;pointer-events:none}
.ptr{width:280px;height:10px;background:#e7d4ac;border:2.5px solid #4a3320;border-radius:99px;overflow:hidden}
.pfil{height:100%;width:100%;background:#82a058;border-radius:99px;
  transform:scaleX(0);transform-origin:left center;transition:transform .3s linear}
/* ── Loading screen: sleeping Mona (from the Solukko project) + real progress label + bar ── */
.loading-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
.loading-mona-wrap{position:relative;width:120px;height:120px}
.loading-mona{width:120px;height:120px;object-fit:contain;image-rendering:auto;
  animation:loadingSleep 3.2s ease-in-out infinite}
@keyframes loadingSleep{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(1.05) rotate(1.5deg)}}
.loading-zzz{position:absolute;top:-50px;right:-6px;width:64px;height:100px;pointer-events:none;overflow:visible}
.loading-zzz span{position:absolute;left:0;bottom:0;font-family:'Courier New',monospace;font-weight:bold;
  color:#4a3320;opacity:0;animation:zFly 2s ease-in-out infinite}
.loading-zzz span:nth-child(1){font-size:15px;animation-delay:0s}
.loading-zzz span:nth-child(2){font-size:21px;animation-delay:.55s}
.loading-zzz span:nth-child(3){font-size:28px;animation-delay:1.1s}
@keyframes zFly{0%{opacity:0;transform:translate(0,14px) rotate(-8deg)}20%{opacity:1}80%{opacity:.85}
  100%{opacity:0;transform:translate(30px,-70px) rotate(18deg)}}
.loading-text{font-family:'Courier New',monospace;font-size:15px;font-weight:bold;color:#4a3320;
  text-align:center;max-width:80vw;min-height:1.2em}
body.dark-mode .loading-zzz span,body.dark-mode .loading-text{color:#c9b48f}
.mlbl{position:absolute;z-index:9;pointer-events:none;color:var(--ink);
  background:var(--paper);border:2.5px solid var(--brown);border-radius:10px;
  padding:2px 8px;font-family:'Courier New',monospace;font-size:11px;font-weight:bold;
  white-space:nowrap;display:none;box-shadow:0 2.5px 0 var(--brown)}
.mlbl.dev{font-size:10px;padding:1px 6px;opacity:.9;box-shadow:0 2px 0 var(--brown)}   /* dev per-model tags: a touch lighter */
#zoomval{position:absolute;top:14px;right:16px;z-index:10;color:var(--brown);
  font-family:'Courier New',monospace;font-size:15px;font-weight:bold;pointer-events:none}
#zoomtips{position:absolute;right:18px;bottom:18px;z-index:10;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  opacity:0;transition:opacity .5s;pointer-events:none;
  font-family:'Courier New',monospace}
#zoomtips.show{opacity:1;pointer-events:auto}
.zt{width:46px;height:46px;font-size:24px;font-weight:bold;line-height:1;cursor:pointer;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:15px;
  box-shadow:0 4px 0 var(--brown);touch-action:manipulation;user-select:none;
  display:flex;align-items:center;justify-content:center}
.zt:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
.ztlabel{font-size:11px;font-weight:bold;color:var(--brown);letter-spacing:1px}
#darkmode-btn{position:absolute;left:16px;top:12px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;
  transition:transform .1s ease,box-shadow .1s ease}
#darkmode-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#darkmode-icon{font-size:16px;line-height:1}
#gfx-btn{position:absolute;left:16px;top:60px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#gfx-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#gfx-icon{font-size:15px;line-height:1}
#color-btn{position:absolute;left:16px;top:108px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#color-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#color-icon{font-size:15px;line-height:1}
#etc-btn{position:absolute;left:16px;top:156px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#etc-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#etc-btn.on{background:var(--sage);color:var(--sageink);box-shadow:0 0 0 3px var(--sage2),0 4px 0 var(--brown)}
#etc-icon{font-size:15px;line-height:1}
#dev-btn{position:absolute;left:16px;top:204px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#dev-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#dev-btn.on{background:var(--sage);color:var(--sageink);box-shadow:0 0 0 3px var(--sage2),0 4px 0 var(--brown)}
#dev-icon{font-size:15px;line-height:1}
#vr-btn{position:absolute;left:16px;top:252px;z-index:12;touch-action:manipulation;
  font-family:'Courier New',monospace;font-size:13px;font-weight:bold;letter-spacing:.5px;
  color:var(--ink);background:var(--paper);border:3px solid var(--brown);border-radius:999px;cursor:pointer;
  box-shadow:0 4px 0 var(--brown);padding:8px 16px;display:inline-flex;align-items:center;gap:7px;
  line-height:1;user-select:none;-webkit-user-select:none;transition:transform .1s ease,box-shadow .1s ease}
#vr-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--brown)}
#vr-icon{font-size:15px;line-height:1}
#speedbox{color:var(--brown)!important}
#speedbox #speedval{font-weight:bold}
/* Speed slider — same palette as the loading bar (.ptr tan track + #4a3320 border + #82a058 fill) */
#speed{-webkit-appearance:none;appearance:none;height:10px;box-sizing:border-box;border-radius:99px;
  background:#e7d4ac;border:2.5px solid #4a3320;outline:none}
/* Knob = a small sage circle with a dark-brown rim, centred on the 10px track:
   margin-top = (trackHeight − thumb)/2 = (10 − 16)/2 = −3px. */
/* Knob = the 48×48 Mona image, used as-is (square, uncropped). Sized 48px, pulled up so it straddles the track. */
#speed::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:48px;height:48px;border:0;
  cursor:pointer;margin-top:-19px;background:url('./mona_knob_48.png') center/48px 48px no-repeat}
#speed::-moz-range-track{height:10px;box-sizing:border-box;border-radius:99px;background:#e7d4ac;border:2.5px solid #4a3320}
#speed::-moz-range-thumb{width:48px;height:48px;border:0;border-radius:0;cursor:pointer;
  background:url('./mona_knob_48.png') center/48px 48px no-repeat}
#speedbox{padding-bottom:19px}   /* room for the oversized knob so it isn't clipped at the window edge */
/* ── UI gizmo panel: move/rotate handles for the selected complex, docked above the speed slider ── */
#gizmo-ui{position:fixed;left:16px;bottom:96px;z-index:26;display:none;width:154px;
  font-family:'Courier New',monospace;color:var(--ink);background:var(--paper);
  border:3px solid var(--brown);border-radius:16px;box-shadow:0 4px 0 var(--brown);
  padding:8px 10px;user-select:none;-webkit-user-select:none}
#gizmo-ui .giz-title{font-size:11px;font-weight:bold;color:var(--brown);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gizmo-ui .giz-pads{display:flex;gap:8px}
#gizmo-ui .giz-pad{flex:1;height:54px;border:2.5px solid var(--brown);border-radius:12px;background:#e7d4ac;
  cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none}
#gizmo-ui .giz-pad.active{cursor:grabbing;background:var(--sage);color:var(--sageink)}
#gizmo-ui .giz-pad span{font-size:20px;line-height:1;pointer-events:none}
#gizmo-ui .giz-pad label{font-size:9px;font-weight:bold;pointer-events:none}
#gizmo-ui .giz-btns{display:flex;gap:5px;margin-top:7px}
#gizmo-ui .giz-btns button{flex:1;font-family:inherit;font-size:10px;font-weight:bold;color:var(--ink);
  background:var(--paper);border:2px solid var(--brown);border-radius:8px;padding:4px 2px;cursor:pointer}
#gizmo-ui .giz-btns button:active{background:var(--sage);color:var(--sageink)}
/* ── Bottom-right stack: hybridisation panel sits ABOVE the spawn element table ── */
#br-stack{position:absolute;right:14px;bottom:14px;z-index:25;display:flex;flex-direction:column;
  align-items:flex-end;gap:12px;pointer-events:none}
#br-stack>*{pointer-events:auto}
/* Panels — thick brown outline, big round corners, chunky drop shadow */
#econf,#eltable{font-family:'Courier New',monospace;background:var(--paper);color:var(--ink);
  border:3px solid var(--brown);border-radius:18px;box-shadow:0 5px 0 var(--brown);user-select:none}
#eltable{padding:10px 11px;max-width:280px}
#eltable .elhdr{font-size:12px;font-weight:bold;color:var(--brown);letter-spacing:.5px;margin-bottom:8px;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
#eltable .elclear{font-family:inherit;font-size:11px;font-weight:bold;color:var(--sageink);background:var(--sage);
  border:2.5px solid var(--brown);border-radius:99px;padding:3px 11px;cursor:pointer;box-shadow:0 2px 0 var(--brown)}
#eltable .elclear:active{transform:translateY(1px);box-shadow:0 1px 0 var(--brown)}
#eltable .elgrid{display:grid;grid-template-columns:repeat(6,37px);gap:6px}
.elbtn{font-family:inherit;font-size:13px;font-weight:bold;color:var(--ink);background:var(--paper2);
  border:2.5px solid var(--brown);border-radius:12px;padding:5px 0 4px;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px;box-shadow:0 2.5px 0 var(--brown);transition:transform .08s,box-shadow .08s}
.elbtn:hover{background:var(--sage)}
.elbtn:active{transform:translateY(2px);box-shadow:0 0.5px 0 var(--brown)}
.elbtn .eldot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.5px var(--brown)}
.elbtn.on{background:var(--sage);color:var(--sageink);box-shadow:0 0 0 3px var(--sage2),0 2.5px 0 var(--brown)}
/* Orbital chips (electron-config panel): electron boxes on the LEFT, then the orbital's REAL shape as the
   button icon (s = sphere, p = dumbbell, sp/sp²/sp³ + lone pair = hybrid lobe), then its identifier text. */
.orb-chip{font-family:inherit;color:var(--brown);background:transparent;border:2px solid transparent;
  border-radius:11px;padding:3px 10px 3px 5px;cursor:pointer;display:flex;flex-direction:row;
  align-items:center;gap:9px;line-height:1.15;text-align:left}
.orb-chip:hover{background:var(--paper2)}
.orb-chip.on{background:var(--sage);color:var(--sageink);border-color:var(--sage2)}
.orb-box{display:inline-flex;gap:5px;align-items:center;min-width:16px;justify-content:center}
.orb-shape{flex:0 0 auto;display:block}
.orb-cap{font-size:10px;font-weight:bold;opacity:.65}
.orb-name{font-size:15px;font-weight:bold}
/* Electron dot that RADIATES expanding wave rings — same idea as the 3-D electrons */
.orb-e{position:relative;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#dcecff,#4f8dff 72%);box-shadow:0 0 3px rgba(79,141,255,.85)}
.orb-e::before,.orb-e::after{content:'';position:absolute;left:50%;top:50%;width:7px;height:7px;
  margin:-3.5px 0 0 -3.5px;border-radius:50%;border:1.5px solid rgba(95,150,255,.85);animation:eripple 1.7s ease-out infinite}
.orb-e::after{animation-delay:.85s}
@keyframes eripple{0%{transform:scale(.5);opacity:.9}60%{opacity:.35}100%{transform:scale(3);opacity:0}}
#c.spawning{cursor:crosshair}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="overlay">
  <div class="loading-inner">
    <div class="loading-mona-wrap">
      <img class="loading-mona" src="./sleeping_mona.png" alt="">
      <div class="loading-zzz"><span>z</span><span>z</span><span>z</span></div>
    </div>
    <div class="loading-text" id="load-lbl">Ladataan…</div>
    <div class="ptr"><div class="pfil" id="load-bar"></div></div>
  </div>
</div>
<button id="darkmode-btn" title="Vaihda tummatila"><span id="darkmode-icon">☀️</span>Teema</button>
<button id="gfx-btn" title="Vaihda esitystapa (orbitaalit ↔ vdW-pallot)"><span id="gfx-icon">⬤</span><span id="gfx-label">vdW-pallot</span></button>
<button id="color-btn" title="Väritys: alkuaineittain ↔ malleittain"><span id="color-icon">🎨</span><span id="color-label">Mallit</span></button>
<button id="etc-btn" title="Korosta elektroninsiirtoketjun kofaktorit (klorofyllit, karotenoidit, kinonit, hemit, feofytiini, Tyr Z, OEC, Fe-S) päälle"><span id="etc-icon">⚡</span><span id="etc-label">ETC-ketju</span></button>
<button id="dev-btn" title="Dev-tila: mallien siirto/kierto-työkalu + sijaintimerkinnät"><span id="dev-icon">🛠️</span><span id="dev-label">Dev</span></button>
<button id="vr-btn" title="Siirry VR-tilaan" style="display:none"><span id="vr-icon">🥽</span><span id="vr-label">VR</span></button>
<div id="zoomval">1.0×</div>
<div id="zoomtips">
  <button class="zt" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="zt" id="zoom-out" aria-label="Zoom out">−</button>
  <span class="ztlabel">suurenna</span>
</div>
<div id="speedbox" style="position:fixed; left:16px; bottom:14px; z-index:10; font:11px ui-monospace,monospace; color:#6a6a5a; user-select:none;">
  <div style="margin-bottom:4px; letter-spacing:.5px;">speed <span id="speedval">1.0×</span></div>
  <input id="speed" type="range" min="0" max="30" value="10" style="width:130px; cursor:pointer;">
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script>
'use strict';

const BOND_R    = 0.10;  // stick radius (Å) — thinner than the smallest ball
const GAP_FRAC  = 0.15;  // side-by-side gap as a fraction of mean model width
const FILL_SCALE = 0.72; // space-filling sphere size as a fraction of vdW radius (tightened so the surface ≈ the orbital cloud, not much bigger)

/* ── Standard CPK-ish colours (c), ball radii (r) + van der Waals radii (vr), Å.
      C dark grey, H light grey.  vr drives the space-filling surface mode.  ── */
/* n = nucleon count (mass number) → nucleus size; z = proton count; en = Pauling electronegativity (bond polarity). */
const ELEM = {
  H :{c:[0.88,0.88,0.88], r:0.23, vr:1.10, n:1,  z:1 , en:2.20},   C :{c:[0.42,0.42,0.42], r:0.32, vr:1.70, n:12, z:6 , en:2.55},
  N :{c:[0.19,0.31,0.97], r:0.31, vr:1.55, n:14, z:7 , en:3.04},   O :{c:[0.94,0.15,0.15], r:0.30, vr:1.52, n:16, z:8 , en:3.44},
  S :{c:[1.00,0.78,0.16], r:0.38, vr:1.80, n:32, z:16, en:2.58},   P :{c:[1.00,0.50,0.00], r:0.38, vr:1.80, n:31, z:15, en:2.19},
  MG:{c:[0.33,0.78,0.33], r:0.42, vr:1.73, n:24, z:12, en:1.31},   FE:{c:[0.88,0.40,0.20], r:0.42, vr:1.56, n:56, z:26, en:1.83},
  MN:{c:[0.61,0.48,0.78], r:0.42, vr:1.61, n:55, z:25, en:1.55},   CA:{c:[0.24,0.80,0.24], r:0.46, vr:1.97, n:40, z:20, en:1.00},
  ZN:{c:[0.49,0.51,0.69], r:0.40, vr:1.39, n:65, z:30, en:1.65},   CU:{c:[0.78,0.50,0.20], r:0.40, vr:1.40, n:64, z:29, en:1.90},
  CL:{c:[0.24,0.94,0.24], r:0.36, vr:1.75, n:35, z:17, en:3.16},   NA:{c:[0.67,0.36,0.95], r:0.46, vr:2.27, n:23, z:11, en:0.93},
  K :{c:[0.56,0.25,0.83], r:0.52, vr:2.75, n:39, z:19, en:0.82},   CO:{c:[0.94,0.56,0.63], r:0.42, vr:1.52, n:59, z:27, en:1.88},
  FB:{c:[0.55,0.55,0.55], r:0.32, vr:1.60, n:12, z:6 , en:2.50},
};
const info = code => ELEM[EL_LIST[code]] || ELEM.FB;
/* Full element names (shown big in the config panel; the symbol is no longer displayed there). */
const ELEM_NAME = {
  H:'Hydrogen', C:'Carbon', N:'Nitrogen', O:'Oxygen', S:'Sulfur', P:'Phosphorus',
  MG:'Magnesium', FE:'Iron', MN:'Manganese', CA:'Calcium', ZN:'Zinc', CU:'Copper',
  CL:'Chlorine', NA:'Sodium', K:'Potassium', CO:'Cobalt', FB:'Atom',
};
const elemName = code => ELEM_NAME[EL_LIST[code]] || EL_LIST[code] || 'Atom';
/* Finnish element names → the panel title reads "<name>atomi" (e.g. Hiili → "Hiiliatomi"). */
const ELEM_NAME_FI = {
  H:'Vety', C:'Hiili', N:'Typpi', O:'Happi', S:'Rikki', P:'Fosfori',
  MG:'Magnesium', FE:'Rauta', MN:'Mangaani', CA:'Kalsium', ZN:'Sinkki', CU:'Kupari',
  CL:'Kloori', NA:'Natrium', K:'Kalium', CO:'Koboltti',
};
const elemNameFi = code => { const n = ELEM_NAME_FI[EL_LIST[code]];
  if(!n) return 'Atomi';
  return n + (/a$/i.test(n) ? '-' : '') + 'atomi';   // "Rauta" → "Rauta-atomi" (a+a needs a hyphen), else just append
};

/* ── Element registry (symbol ↔ small integer code) ───────────────────── */
const EL_CODE = new Map(), EL_LIST = [];
function codeOf(sybyl){
  const dot = sybyl.indexOf('.');
  let sym = (dot === -1 ? sybyl : sybyl.slice(0, dot)).toUpperCase();
  if(!ELEM[sym]) sym = 'FB';
  let c = EL_CODE.get(sym);
  if(c === undefined){ c = EL_LIST.length; EL_CODE.set(sym, c); EL_LIST.push(sym); }
  return c;
}

const setLbl = t => { const e = document.getElementById('load-lbl'); if(e) e.textContent = t; };
const setBar = v => { const e = document.getElementById('load-bar');
  if(e) e.style.transform = 'scaleX(' + Math.max(0, Math.min(1, v/100)) + ')'; };
const yield_ = () => new Promise(r => setTimeout(r, 0));

/* ── Goodsell-style muted palette, coloured by molecular component ─────── */
const CAT_COLORS = [
  [0.52,0.47,0.27],   // 0 protein     — muted olive/khaki
  [0.30,0.48,0.28],   // 1 chlorophyll — muted green
  [0.86,0.47,0.17],   // 2 carotenoid  — orange
  [0.60,0.22,0.18],   // 3 heme        — rust red
  [0.72,0.63,0.39],   // 4 lipid       — tan
  [0.52,0.55,0.62],   // 5 metal/ion   — slate
  [0.60,0.55,0.44],   // 6 other       — neutral tan
];
const RES_CAT = {};
'ALA ARG ASN ASP CYS GLN GLU GLY HIS ILE LEU LYS MET PHE PRO SER THR TRP TYR VAL HOH'.split(' ').forEach(r=>RES_CAT[r]=0);
'CHL CLA PHO BCL'.split(' ').forEach(r=>RES_CAT[r]=1);
'BCR LUT NEX XAT VIO ZEA ECH'.split(' ').forEach(r=>RES_CAT[r]=2);   // ECH = echinenone (b6f)
'HEM HEC'.split(' ').forEach(r=>RES_CAT[r]=3);
'DGD LMG LHG PL9 SQD LMT 6PL PGV LFA'.split(' ').forEach(r=>RES_CAT[r]=4);   // 6PL/PGV/LFA = b6f phospholipids + fatty acid
'CL FE2 FE MG MN CA NA K ZN OEX BCT CU CO'.split(' ').forEach(r=>RES_CAT[r]=5);
const catOf = res => RES_CAT[res] ?? 6;
// Electron-transport-chain cofactors → flagged so a button can render them on top of everything.
// The FULL light-harvesting + electron-transport set: every chlorophyll (antenna AND reaction-centre —
// P680/P700 can't be told apart from antenna Chl in this data), every carotenoid, the quinones, hemes,
// pheophytins, metal clusters, and Tyr Z (tagged geometrically in markTyrZ — it's a plain TYR residue,
// identified as the one hydrogen-bonded to the OEC).
// Each cofactor residue → a TYPE code (1-9) so the overlay can colour them by role, in vivid hues
// that stand out from the muted parent-model palette.
const ETC_RES = { OEX:1, MN:1, CA:1,   PHO:2,   PL9:3, PQN:3, PQ9:3, UQ:3,   HEM:4, HEC:4,
  SF4:5, FES:5, F3S:5, FE:5, FE2:5,   CU:6,
  CLA:7, CHL:7, BCL:7, CL0:7,                                   // chlorophylls (antenna + reaction centre)
  BCR:8, LUT:8, NEX:8, XAT:8, VIO:8, ZEA:8, LU2:8, A86:8, ECH:8 };   // carotenoids (ECH = echinenone, b6f)
const ETC_TYRZ = 9;                                             // assigned geometrically, not by residue name
// Every cofactor type is one of five bright hues: RED, GREEN, CORAL, BLUE, PINK.
const _RED=[1.00,0.16,0.16], _GRN=[0.16,0.90,0.36], _COR=[1.00,0.50,0.34], _BLU=[0.28,0.56,1.00], _PNK=[1.00,0.42,0.80];
const ETC_COL = [ [0,0,0],   // 0 unused
  _COR,   // 1 OEC (Mn₄CaO₅)        — coral
  _PNK,   // 2 pheophytin           — pink
  _BLU,   // 3 plasto/phyllo-quinone — blue
  _RED,   // 4 heme                  — red
  _GRN,   // 5 Fe-S cluster          — green
  _BLU,   // 6 Cu (plastocyanin)     — blue
  _GRN,   // 7 chlorophyll           — green
  _COR,   // 8 carotenoid            — coral
  _PNK ]; // 9 Tyr Z (D1-Tyr161)     — pink

/* ── Parse a multi-molecule mol2 into typed-array records ──────────────── */
function parseMol2(text){
  const lines = text.split('\n');
  const mols = [];
  let cur = null, section = '';
  for(let i = 0; i < lines.length; i++){
    const ln = lines[i];
    if(ln.charCodeAt(0) === 64){                 // '@' → section marker
      const t = ln.trim();
      if(t === '@<TRIPOS>MOLECULE'){ cur = {name:null}; mols.push(cur); section = 'HDR'; }
      else if(t === '@<TRIPOS>ATOM')  section = 'ATOM';
      else if(t === '@<TRIPOS>BOND')  section = 'BOND';
      else section = 'OTHER';
      continue;
    }
    if(section === 'HDR'){
      if(cur.name === null){ cur.name = ln.trim(); }
      else if(cur.na === undefined){
        const p = ln.trim().split(/\s+/);
        cur.na = +p[0]; cur.nb = +p[1] || 0;
        cur.x  = new Float32Array(cur.na); cur.y = new Float32Array(cur.na);
        cur.z  = new Float32Array(cur.na); cur.el = new Uint16Array(cur.na); cur.ai = 0;
        cur.cat = new Uint8Array(cur.na);
        cur.cof = new Uint8Array(cur.na);  // 1 = electron-transport-chain cofactor (for the render-on-top overlay)
        cur.sid = new Int32Array(cur.na);  // subst_id (residue instance) → to extract one chlorophyll
        cur.tyr = new Uint8Array(cur.na);  // 1 = atom of a TYR residue → markTyrZ picks the one beside the OEC
        cur.b1 = new Int32Array(cur.nb);   cur.b2 = new Int32Array(cur.nb);  cur.bi = 0;
        cur.bo = new Uint8Array(cur.nb);   // bond order (1 single, 2 double, 3 triple)
      }
      continue;
    }
    if(section === 'ATOM'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 6 || cur.ai >= cur.na) continue;
      const k = cur.ai++;
      cur.x[k] = +p[2]; cur.y[k] = +p[3]; cur.z[k] = +p[4]; cur.el[k] = codeOf(p[5]);
      cur.cat[k] = catOf(p[7] || ''); cur.sid[k] = +p[6] || 0; cur.cof[k] = ETC_RES[p[7]] || 0;   // 0 = not a cofactor, else type code 1-9
      if(p[7] === 'TYR') cur.tyr[k] = 1;
    } else if(section === 'BOND'){
      const p = ln.trim().split(/\s+/);
      if(p.length < 4 || cur.bi >= cur.nb) continue;
      const k = cur.bi++;
      cur.b1[k] = (+p[1]) - 1; cur.b2[k] = (+p[2]) - 1;
      cur.bo[k] = p[3]==='2' ? 2 : p[3]==='3' ? 3 : 1;   // double / triple / (single, aromatic, amide → 1)
    }
  }
  return mols.filter(m => m.na > 0);
}

/* Tyr Z (D1-Tyr161) — the redox-active tyrosine that ferries electrons from the OEC to P680⁺.
   The mol2 carries no chain id or PDB numbering, so name-matching can't find it; instead we use the
   geometry that DEFINES it: it is the one tyrosine hydrogen-bonded to the Mn₄CaO₅ cluster (~5 Å).
   Tyr D, its pseudo-symmetric twin on D2, sits ~30 Å from any Mn and is correctly left unmarked.
   A dimer simply yields one Tyr Z per monomer. Marks every atom of each matching TYR residue. */
function markTyrZ(m){
  if(!m.tyr || !m.cof) return;
  const oi=[];                                                 // OEC atom indices (Mn/Ca/O of the cluster)
  for(let k=0;k<m.na;k++) if(m.cof[k]===1) oi.push(k);
  if(!oi.length) return;                                       // no OEC in this model → no Tyr Z
  // Split the OEC atoms into clusters (one per PSII monomer) by single-linkage within 6 Å.
  const cid = new Array(oi.length).fill(-1); let nc = 0;
  for(let a=0;a<oi.length;a++){
    if(cid[a] >= 0) continue;
    cid[a] = nc; const stack=[a];
    while(stack.length){ const p=stack.pop(), pk=oi[p];
      for(let b=0;b<oi.length;b++){ if(cid[b]>=0) continue; const bk=oi[b];
        const dx=m.x[pk]-m.x[bk], dy=m.y[pk]-m.y[bk], dz=m.z[pk]-m.z[bk];
        if(dx*dx+dy*dy+dz*dz < 36){ cid[b]=nc; stack.push(b); } } }
    nc++;
  }
  // Per cluster, the SINGLE closest tyrosine is Tyr Z (its OH hydrogen-bonds the cluster, ~5 Å).
  // Tyr D, the pseudo-symmetric twin on D2, is ~30 Å away and never wins.
  const best = new Array(nc).fill(-1), bestD = new Array(nc).fill(Infinity);
  const resMin = new Map();                                    // residue id → [minDist², cluster]
  for(let k=0;k<m.na;k++){
    if(!m.tyr[k]) continue;
    for(let a=0;a<oi.length;a++){ const ok=oi[a];
      const dx=m.x[k]-m.x[ok], dy=m.y[k]-m.y[ok], dz=m.z[k]-m.z[ok], d2=dx*dx+dy*dy+dz*dz;
      const cur = resMin.get(m.sid[k]);
      if(!cur || d2 < cur[0]) resMin.set(m.sid[k], [d2, cid[a]]);
    }
  }
  // Only a REAL Mn₄CaO₅ cluster counts — lone Mn/Ca ions elsewhere in the structure form their own
  // 1-2 atom "clusters" and would each drag in a spurious nearby tyrosine.
  const csize = new Array(nc).fill(0); for(const c of cid) csize[c]++;
  for(const [sid, v] of resMin){ const [d2, c] = v;
    if(csize[c] >= 4 && d2 < 100 && d2 < bestD[c]){ bestD[c] = d2; best[c] = sid; } }   // within 10 Å, nearest wins
  const hit = new Set(best.filter(s => s >= 0));
  if(!hit.size) return;
  for(let k=0;k<m.na;k++) if(m.tyr[k] && hit.has(m.sid[k])) m.cof[k] = ETC_TYRZ;
}

/* Pull one complete chlorophyll (CLA/CHL/PHO residue) out of the model as its own molecule. */
function extractChlorophyll(m){
  if(!m.sid) return null;
  const groups = new Map();                      // group chlorophyll atoms by residue id
  for(let k=0;k<m.na;k++) if(m.cat[k]===1){
    const g = groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k], [k]);
  }
  let best = null;
  for(const g of groups.values()) if(!best || g.length > best.length) best = g;   // the largest = a full chlorophyll
  if(!best || best.length < 20) return null;
  const na = best.length, map = new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const nm = { name:'Chlorophyll', na, ai:na, nb:0,
    x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na),
    el:new Uint16Array(na), cat:new Uint8Array(na), sid:new Int32Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li];
    nm.x[li]=m.x[gi]; nm.y[li]=m.y[gi]; nm.z[li]=m.z[gi]; nm.el[li]=m.el[gi]; nm.cat[li]=m.cat[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  nm.nb=b1.length; nm.b1=Int32Array.from(b1); nm.b2=Int32Array.from(b2); nm.bo=Uint8Array.from(bo);
  return nm;
}

/* Pull one lipid molecule (category 4) out of the model → atoms AND its internal bonds
   (the bonds are needed to build the same hybridised σ/π/lone-pair lobes as the protein). */
function extractLipid(m){
  if(!m.sid) return null;
  const groups = new Map();
  for(let k=0;k<m.na;k++) if(m.cat[k]===4){ const g=groups.get(m.sid[k]); if(g) g.push(k); else groups.set(m.sid[k],[k]); }
  let best=null;
  for(const g of groups.values()) if(!best || g.length>best.length) best=g;   // largest = a complete lipid
  if(!best || best.length < 30) return null;
  const na=best.length, map=new Map();
  best.forEach((gi,li) => map.set(gi, li));
  const out={ na, nb:0, x:new Float32Array(na), y:new Float32Array(na), z:new Float32Array(na), el:new Uint16Array(na) };
  for(let li=0;li<na;li++){ const gi=best[li]; out.x[li]=m.x[gi]; out.y[li]=m.y[gi]; out.z[li]=m.z[gi]; out.el[li]=m.el[gi]; }
  const b1=[], b2=[], bo=[];                      // keep only bonds internal to this residue (remapped)
  for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k];
    if(map.has(a) && map.has(b)){ b1.push(map.get(a)); b2.push(map.get(b)); bo.push(m.bo[k]); } }
  out.nb=b1.length; out.b1=Int32Array.from(b1); out.b2=Int32Array.from(b2); out.bo=Uint8Array.from(bo);
  return out;
}

/* GPU sphere impostors: a camera-facing quad per atom; the fragment shader
   ray-traces a perfect sphere and writes real depth, so spheres are smooth at
   any zoom and cost 2 triangles each. */
BABYLON.Effect.ShadersStore['impVertexShader'] = `
precision highp float;
attribute vec3 position;
attribute vec4 instanceColor;
attribute vec4 world0;
attribute vec4 world1;
attribute vec4 world2;
attribute vec4 world3;
#ifdef IMPRAD
attribute float instR;   // per-instance radius multiplier (vdW LOD spheres — one mesh, mixed elements)
#endif
uniform mat4 view;
uniform mat4 projection;
uniform float radius;
uniform float uT;        // thermal-shake time (0 = still)
uniform float boil;      // line-boil: STEPPED per-atom jitter of the billboard centre (0 = off)
#ifdef LIPTILE
uniform vec3 tileOff;    // per-mesh translation so membrane tiles can share ONE nucleon template buffer
#endif
#ifdef MACROMOVE
uniform mat4 macroXform; uniform vec3 macroCenter;
#endif
#ifdef MODELMOVE
attribute float modelId;         // which loaded model this instance belongs to (index into modelOff)
uniform mat4 modelXform[24];     // per-model transform (rotate around centre + translate) for repositioning
uniform vec3 modelCol[24];       // per-model pastel colour
uniform float colorMode;         // 1 = colour by model (pastel), 0 = by element
#endif
varying vec2 vUV;
varying vec3 vCenterV;
varying vec3 vColor;
varying vec3 vWCen;      // instance world centre → identify the selected atom's nucleons
varying float vFlag;     // instance alpha → 1 for protons, 0 for neutrons
varying float vRad;      // per-instance radius (= uniform radius unless IMPRAD scales it)
varying float vMid;      // which model this instance belongs to (−1 = not model-tagged) → sage selection rim
varying vec3 vWB0;       // rows of the view rotation = view→world basis → reconstruct the WORLD surface
varying vec3 vWB1;       // normal in the fragment so the boil warp is object-locked (rotates WITH the
varying vec3 vWB2;       // sphere instead of swimming in screen space)
#ifdef MEMFADE
varying float vMemAnc;   // this atom's LIPID anchor Z (identical across the whole molecule) → the cross-cut hides WHOLE lipids
#ifndef LIPTILE
attribute float memAnc;
#endif
#endif
#ifdef ETCHL
attribute float groupId;   // per-cofactor-atom group index → the fragment brightens the hovered / flashing group
varying float vGid;
#endif
vec3 shake(vec3 p){ return p + 0.12*vec3(sin(uT*1.3+p.x*0.12+p.y*0.08), sin(uT*1.1+p.y*0.12+p.z*0.08), sin(uT*1.6+p.z*0.12+p.x*0.08)); }
#ifdef MEMFADE
// Membrane-only fluid sway. The phase is taken from the IN-PLANE position (x,z) alone, so every atom
// of one upright lipid shares it and the lipid stays rigid, while lipids a tile apart are out of
// phase and visibly slide past one another — a fluid bilayer, not one sheet breathing as a block.
vec3 memSway(vec3 b){ float ph = b.x*0.28 + b.z*0.24;
  return vec3(0.62*sin(uT*0.85 + ph), 0.26*sin(uT*0.63 + ph*1.7), 0.62*cos(uT*0.74 + ph*1.3)); }
#endif
void main(void){
  mat4 W = mat4(world0, world1, world2, world3);
  vec3 base = W[3].xyz;
#ifdef LIPTILE
  base += tileOff;
#endif
#ifdef MODELMOVE
  base = (modelXform[int(modelId + 0.5)] * vec4(base, 1.0)).xyz;
#endif
  vWCen = base;
  vec3 wc = shake(base);
  if(boil > 0.001){ float bt = floor(uT * 7.0);   // stepped clock → jitter jumps ~7x/sec (hand-drawn boil, not smooth)
    float hx = fract(sin(dot(base, vec3(12.9898, 78.233, 37.719)) + bt) * 43758.5453) - 0.5;
    float hy = fract(sin(dot(base, vec3(93.989, 47.271, 23.157)) + bt*2.3) * 19349.663) - 0.5;
    float hz = fract(sin(dot(base, vec3(39.346, 11.135, 83.155)) + bt*1.7) * 24634.633) - 0.5;
    wc += boil * 0.2 * vec3(hx, hy, hz);   // small per-atom drift — the SHAPE warp itself is done in the fragment, this is just a little life
  }
#ifdef MEMFADE
  wc += memSway(base);
#ifdef LIPTILE
  vMemAnc = tileOff.z;   // pooled nucleons: the tile origin IS the lipid anchor (one tile per mesh)
#else
  vMemAnc = memAnc;      // per-instance lipid anchor
#endif
#endif
#ifdef MACROMOVE
  wc = (macroXform * vec4(wc - macroCenter, 1.0)).xyz;
#endif
  vec4 cV = view * vec4(wc, 1.0);
  vCenterV = cV.xyz;
  // Rows of the view rotation = the view→world basis. In the fragment, world-normal = these · view-normal,
  // giving each sphere's surface a WORLD-space parameterisation the boil warp can lock onto (no swim).
  vWB0 = vec3(view[0][0], view[1][0], view[2][0]);
  vWB1 = vec3(view[0][1], view[1][1], view[2][1]);
  vWB2 = vec3(view[0][2], view[1][2], view[2][2]);
  float qexp = boil > 0.001 ? 1.2 : 1.0;   // enlarge the billboard while boiling so a bulging silhouette has headroom
  vUV = position.xy * qexp;
  vColor = instanceColor.rgb;
  vFlag = instanceColor.a;
  vMid = -1.0;
#ifdef ETCHL
  vGid = groupId;
#endif
#ifdef MODELMOVE
  if(colorMode > 0.5) vColor = modelCol[int(modelId + 0.5)];
  vMid = modelId;
#endif
  float rad = radius;
#ifdef IMPRAD
  rad *= instR;
#endif
  vRad = rad;
  // Billboard that faces the actual eye (view-space origin), not just the view axis. At the wide
  // off-axis FOV of a VR headset a view-axis billboard visibly swings as you turn — reading as the
  // balls "following" your head — whereas facing the eye keeps them put. Identical on-axis (desktop).
  vec3 vToEye = normalize(-cV.xyz);
  vec3 upv = abs(vToEye.y) > 0.99 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
  vec3 vr = normalize(cross(upv, vToEye));
  vec3 vu = cross(vToEye, vr);
  vec3 cornerV = cV.xyz + (vr * position.x + vu * position.y) * rad * qexp;
  gl_Position = projection * vec4(cornerV, 1.0);
}`;

varying float vSeed;
varying float vSel;

varying float vCang;

varying float vMemAnc;
#endif

// Electron glow: a small breathing point of light that slowly orbits its camera-facing spot,
// with flickering electric filaments crackling around it. nElec = 1 or 2.
float elecBolt(vec3 N, vec3 e, vec3 uref){
  float fr = (vOid >= 2000.0) ? 1.9 : (vOid >= 900.0) ? 1.2 : (0.6*max(0.0, floor(vOid/100.0) - 1.0));   // energy ladder: core shells (rise with n) < bonding σ/π (900–1999, stabilised) < lone pairs (≥2000, non-bonding, often the HOMO)
  float d = clamp(dot(N, e), -1.0, 1.0);
  vec3 tp = N - d*e;
  vec3 u = normalize(uref - dot(uref, e)*e), w = cross(e, u);
  float ang = atan(dot(tp, w), dot(tp, u));
  float rad = acos(clamp(d, 0.0, 1.0));               // angular distance from the electron point

  // azimuthal phase (m·ang − ω·t + spiral) while the concentric rings breathe outward. m (crests
  // around the ring) rises with orbital energy — the moving, phase-shifting ripple, not a static bloom.
  float m = 3.0 + fr * 9.0;
  float rings  = 0.5 + 0.5*sin(rad*20.0 - uT*2.5);          // concentric rings, slow outward breath
  float travel = 0.6 + 0.4*sin(ang*m - uT*4.0 + rad*6.0);   // bright crests march AROUND the circle

vec3 wanderDir(float s){
  return normalize(vec3(
    sin(uT*0.73 + s) + 0.7*sin(uT*1.61 + s*2.3),
    sin(uT*0.91 + s*1.7) + 0.7*sin(uT*1.29 + s*0.6),
    sin(uT*1.13 + s*0.4) + 0.7*sin(uT*0.53 + s*3.1)));

// (never slips behind the lobe), while still roaming the whole visible surface.
vec3 toFront(vec3 w, vec3 V, vec3 fb){

vec3 wanderDir(float s){
  return normalize(vec3(
    sin(uT*0.73 + s) + 0.7*sin(uT*1.61 + s*2.3),
    sin(uT*0.91 + s*1.7) + 0.7*sin(uT*1.29 + s*0.6),
    sin(uT*1.13 + s*0.4) + 0.7*sin(uT*0.53 + s*3.1)));
}
vec3 toFront(vec3 w, vec3 V, vec3 fb){
  float d = clamp(dot(w, V), -1.0, 1.0);
  vec3 tang = w - d*V; float tl = length(tang);
  tang = tl > 1e-4 ? tang/tl : fb;
  float polar = acos(d) * 0.42;
  return cos(polar)*V + sin(polar)*tang;
}
vec3 electronGlow(float ne){
  vec3 N = normalize(vNrmV);
  vec3 V = normalize(-vViewPos);
  float ph = vSeed * 6.2831;
  vec3 axA = vec3(cos(ph), sin(ph), 0.0);
  vec3 axB = vec3(-sin(ph), cos(ph), 0.0);
  // Steady electric radiation (no flash) — every atom's electrons crackle at once.
  vec3 e1 = toFront(wanderDir(ph), V, axA);
  float d1 = max(dot(N, e1), 0.0);
  float glow = pow(d1, 44.0), core = pow(d1, 220.0), bolt = elecBolt(N, e1, axA);
  if(ne > 1.5){
    vec3 e2 = toFront(wanderDir(ph + 2.4), V, axB);
    float d2 = max(dot(N, e2), 0.0);
    glow += pow(d2, 44.0); core += pow(d2, 220.0); bolt += elecBolt(N, e2, axB);
  }

  return bb * (glow*0.9 + bolt*1.0)

}
void main(void){
  // TRUE ALPHA — additive pass, so coverage scales the glow instead of keying a dither.
  float alpha = 1.0;
#ifdef MEMFADE
  alpha *= 1.0 - memCut.z * step(0.0,(vMemW.z - memCut.x)*memCut.y);   // hard cut plane — only memCut.z (the 2.5 s fade) is ever partial
#endif
  alpha *= 1.0 - smoothstep(bubbleR - 8.0, bubbleR, length(vViewPos));
  if(coneCos > -0.5) alpha *= 1.0 - smoothstep(coneCos*0.86, coneCos, vCang);

  float foc = (focusId >= 0.0 && vSel > 0.5 && abs(vOid - focusId) > 0.5) ? 0.05 : 1.0;   // isolate → other orbitals' electrons dim to  5%

  vec4 clip = projection * vec4(pv, 1.0);
  gl_FragDepthEXT = clip.z / clip.w * 0.5 + 0.5;
  gl_FragColor = vec4(g, 1.0);
}`;

varying vec2 vUV;
uniform sampler2D textureSampler;
uniform vec2 texel;      // (1/width, 1/height)
uniform float edgeAmt;   // ink line strength
uniform float bands;     // posterise levels per channel
uniform float paperAmt;  // paper-grain amount
uniform float bright;    // overall brightness lift

  blur += texture2D(textureSampler, vUV + texel*vec2(-1.4, 0.0)).rgb;
  blur += texture2D(textureSampler, vUV + texel*vec2( 0.0, 1.4)).rgb;
  blur += texture2D(textureSampler, vUV + texel*vec2( 0.0,-1.4)).rgb;

  vec3 lit = pow(clamp(blur * bright, 0.0, 1.0), vec3(0.8));

  // Posterise into flat painted bands.
  vec3 p = floor(lit * bands + 0.5) / bands;

  float lum = luma(p);
  p = mix(vec3(lum), p, 0.9);

  float mr=luma(texture2D(textureSampler,vUV+texel*vec2( 1., 0.)).rgb);
  float bl=luma(texture2D(textureSampler,vUV+texel*vec2(-1., 1.)).rgb);
  float bc=luma(texture2D(textureSampler,vUV+texel*vec2( 0., 1.)).rgb);
  float br=luma(texture2D(textureSampler,vUV+texel*vec2( 1., 1.)).rgb);

uniform sampler2D textureSampler;
uniform sampler2D cofMask;
uniform vec2 texel;

/* ── Fetch + parse + build a mol2 file, then render it ─────────────────── */
async function run(){
  /* ── Thylakoid membrane scene ─────────────────────────────────────────────
     Integral complexes are embedded in the bilayer (Y≈0) in electron-transport order
     along X; soluble partners sit on the stroma (+Y) or lumen (−Y) face beside their
     functional partner. x = position along the membrane, y = 0 membrane / + stroma /
     − lumen, z = depth into the membrane plane. */
  const MEMBRANE_Y = 0;
  // Filenames now match their content, but complexes are still identified by their INTERNAL name /
  // PDB-or-AlphaFold code (robust regardless of filename).
  // x = along the membrane, y = 0 membrane / + stroma / − lumen, z = depth into the plane.
  const MODELS = [
    {match:'3jcu',   x:-560, y:0,    z:0,    rot:[54,-171,-180], label:'Photosystem II'},
    {match:'7r0w',   x:-221, y:8,    z:11,   rot:[0,0,-2],     label:'Cytochrome b6f'},
    {match:'9e0j',   x:460,  y:0,    z:0,    rot:[-77,132,-130], label:'Photosystem I'},
    {match:'6l7o',   x:97,   y:35,   z:30,   rot:[51,-159,70],   label:'NDH-1'},
    {match:'6vm1',   x:760,  y:84,   z:0,    rot:[-69,102,33],   label:'ATP synthase'},
    {match:'1ag6',   x:-10,  y:-190, z:0,    label:'Plastocyanin'},
    {match:'q39249', x:-600, y:-190, z:10,   label:'Violaxanthin de-epoxidase'},
    {match:'1a70',   x:230,  y:250,  z:20,   label:'Ferredoxin'},
    {match:'1gjr',   x:400,  y:290,  z:80,   label:'FNR'},
    {match:'1rcx',   x:600,  y:380,  z:-80,  label:'RuBisCO'},
    {match:'q9sl05', x:-40,  y:220,  z:90,   label:'PGR5'},
    {match:'q8h112', x:30,   y:185,  z:-90,  label:'PGRL1'},
    {match:'q9s713', x:-360, y:230,  z:90,   label:'STN7'},
    {match:'4yzg',   x:-470, y:220,  z:-80,  label:'PPH1'},
    {match:'q9fgc7', x:-640, y:230,  z:0,    label:'Zeaxanthin epoxidase'},
    {match:'chlorophyll', x:-560, y:150, z:130, label:'Chlorophyll'},   // one CLA plucked from PSII → its own file
    {match:'plastoquinone', x:-495, y:150, z:135, label:'Plastoquinone'},   // one PL9 plucked from cytb6f → its own file, beside the lone chlorophyll
  ];
  const FILES = ['PSII.mol2','photosystem_I.mol2','cytochrome_b6f.mol2','ATP_synthase.mol2','NDH-1.mol2',
    'ferredoxin.mol2','FNR.mol2','RuBisCO.mol2','plastocyanin.mol2','PGR5.mol2',
    'PGRL1.mol2','PPH1.mol2','STN7.mol2','Violaxanthin_de-epoxidase.mol2','Zeaxanthin_epoxidase.mol2','chlorophyll.mol2','quinone.mol2'];
  const barEl = document.getElementById('load-bar');
  setLbl('Fetching thylakoid models…');
  const mols = [];
  for(let i=0;i<FILES.length;i++){ const fn=FILES[i];
    setLbl(`Fetching ${fn}…`); setBar((i/FILES.length)*45);
    try{
      const res = await fetch('./'+fn);
      if(!res.ok){ console.warn('skip (HTTP '+res.status+')', fn); continue; }
      const ab = await res.arrayBuffer();
      const parsed = parseMol2(new TextDecoder().decode(new Uint8Array(ab)));
      for(const m of parsed){ if(m.na<=0) continue;
        const nm = (m.name||'').toLowerCase();
        const cfg = MODELS.find(e => !e._used && nm.includes(e.match));   // match by internal name/code
        if(!cfg){ console.log('unmatched molecule "'+m.name+'" in '+fn+' (skipped)'); continue; }
        cfg._used = true; cfg.file = fn; m.cfg = cfg; m.name = cfg.label;
        markTyrZ(m);                                   // tag the OEC-adjacent tyrosine as Tyr Z (needs raw, pre-transform coords)
        mols.push(m); }
    }catch(err){ console.warn('failed to load', fn, err); }
    await yield_();
  }
  if(mols.length === 0) throw new Error('No models loaded — are the .mol2 files next to index.html?');
  setLbl('Placing complexes…'); await yield_();
  const psii = mols.find(m => m.cfg && m.cfg.match==='3jcu') || mols[0];
  const chl = null;   // chlorophyll is now a normal model (chlorophyll.mol2), not a runtime-extracted showcase — every `if(chl)`/`m===chl` guard below no-ops
  const lipid = extractLipid(psii);              // one lipid → tiled into the bilayer

  // Rotate every model 90° about Z (as before) so complexes stand upright-ish across the membrane.
  for(const m of mols){ for(let k=0;k<m.na;k++){ const x=m.x[k], y=m.y[k]; m.x[k]=y; m.y[k]=-x; } }
  if(chl){ for(let k=0;k<chl.na;k++){ const x=chl.x[k], y=chl.y[k]; chl.x[k]=y; chl.y[k]=-x; }

  const canvas = document.getElementById('c');

  // on WebGL, which renders correctly. Remove the `wantWebGPU &&` guard once WebGPU rendering is fixed.

  }
  if (!engine) engine = new BABYLON.Engine(canvas, true, {stencil:true});   // stencil → nucleus shows through its OWN orbitals but is hidden by others
  engine.enableOfflineSupport = false;   // perf: skip the .manifest network probe per scene file
  // WebGPU uses a [0,1] NDC z-range; WebGL uses [-1,1]. Our impostor shaders write gl_FragDepth by hand as
  // clip.z/clip.w*0.5+0.5 (the WebGL remap). On WebGPU clip.z/clip.w is ALREADY [0,1], so drop the remap —
  // otherwise every sphere/nucleus gets a wrong depth and the whole scene reads as empty. Patch the shader
  // source once, before any material compiles.

  scene.skipPointerMovePicking = true;   // perf: we never auto-pick on pointer-move (all picking is done manually in our own handlers)

  scene.fogColor = new BABYLON.Color3(0.16,0.17,0.13);         // kept only to satisfy the shaders' fogColor uniform (fog factor is pinned to 1 → never mixed in)
  // ── Theme toggle: light (cream) ↔ warm-dark (Solukko brown palette) ─────────
  const THEME = {
    light:{ clear:new BABYLON.Color4(0.055,0.135,0.082,1), fog:new BABYLON.Color3(0.16,0.17,0.13) },
    dark: { clear:new BABYLON.Color4(0.055,0.135,0.082,1), fog:new BABYLON.Color3(0.10,0.075,0.05) }
  };
  let darkMode = false;
  try { darkMode = JSON.parse(localStorage.getItem('solukone-dark') || 'false'); } catch(_){}
  const applyTheme = () => {
    const t = darkMode ? THEME.dark : THEME.light;

    document.body.classList.toggle('dark-mode', darkMode);

  const BG_GREEN = new BABYLON.Color3(0.055, 0.135, 0.082);   // static dark green

  bgMat.onBindObservable.add(()=>{ const eff=bgMat.getEffect(); if(!eff) return; eff.setColor3('cBg', BG_GREEN); });

  bgQuad.material = bgMat; bgQuad.isPickable = false; bgQuad.alwaysSelectAsActiveMesh = true;
  bgQuad.renderingGroupId = 0; bgQuad.infiniteDistance = true;   // stays behind everything

    BABYLON.Vector3.Zero(), scene);

  // pointer rotation is disabled (empty button list) so it never fights our handlers.

  // Show the zoom tips while dragging; keep them 2 s after release (or after a tap).

            modelDragDepth = (isFinite(_modelPickT) && _modelPickT > 0.5) ? _modelPickT
              : BABYLON.Vector3.Distance(cam.position, new BABYLON.Vector3(mi.cx+gModelOff[mid*3], mi.cy+gModelOff[mid*3+1], mi.cz+gModelOff[mid*3+2]));

      if(dragAtom >= 0){ dragSpawnedTo(dragAtom); return; }    // dragging a spawned atom along the sheet
      // Plain hover (no button held) → grab hand over any molecule, default cursor over the background.
      // Done HERE (in the guaranteed-to-run pointer observer, keyed on the live button state) so the cursor
      // never gets stuck and never depends on the separate hover observer having registered.
      if(!e.buttons) setCursor(pickModelAtCursor() >= 0 ? GRAB_CUR : '');
      // Zoom is on the wheel. (No mid-drag re-pivot: calling cam.setTarget() during a drag fights the
      //  rotation and kills dragging — see the CLAUDE.md note. Our rotation uses inertial offsets, not setTarget.)
    }
  });

  // Custom wheel + buttons route through zoomBy so they dolly through too (no flip).
  cam.inputs.removeByType('ArcRotateCameraKeyboardMoveInput');
  cam.inputs.removeByType('ArcRotateCameraMouseWheelInput');
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    zoomBy(Math.sign(e.deltaY) * Math.max(fitRadius * 0.03, Math.abs(cam.radius) * 0.06) * Math.max(0.2, gSpeed));

  }, {passive:false});
  const btnZoom = dir => { zoomBy(dir * Math.max(fitRadius * 0.04, Math.abs(cam.radius) * 0.06) * Math.max(0.2, gSpeed)); showTips(); hideTipsSoon(); };
  document.getElementById('zoom-in').addEventListener('click',  () => btnZoom(-1));
  document.getElementById('zoom-out').addEventListener('click', () => btnZoom(1));
  // Ambient fill + a headlight that follows the camera (direction set each frame),
  // so shading stays consistent as the model rotates instead of sweeping around.
  const hemi = new BABYLON.HemisphericLight('h', new BABYLON.Vector3(0,1,0), scene);
  hemi.intensity = 0.80; hemi.groundColor = new BABYLON.Color3(0.50,0.50,0.50);  // flat, matte fill

  dir.intensity = 0.45;   // gentle form; AO + rim carry the shading

  /* Allocate instance buffers + build geometry */
  setLbl(`Building ${mols.length} model(s)…`); await yield_();
  const LP = {N:1, O:2, S:2, P:1, CL:3};          // lone pairs per element (non-bonding orbitals)
  const lonePairs = e => LP[EL_LIST[e]] || 0;
  const sphBuf = [], cylBuf = [], wBuf = [], knobBuf = [], cylAtBuf = [], cylOidBuf = [], cenBuf = [], lpBuf = [], lpCenBuf = [], lpOidBuf = [], colBuf = [], cofBuf = [], resBuf = [],
        sphIdx = new Uint32Array(nEl), cylIdx = new Uint32Array(nEl), lpIdx = new Uint32Array(nEl);

    wBuf[e]   = new Float32Array(halfCount[e]);                // per-lobe width (electronegativity)
    knobBuf[e] = new Uint8Array(halfCount[e]);                 // 1 = small back-knob → skipped by the selection outline
    cylAtBuf[e] = new Int32Array(halfCount[e]).fill(-1);       // per-lobe owning atom index (element-local) → picking
    cylOidBuf[e] = new Float32Array(halfCount[e]);             // per-lobe orbital id (hybrid = 1000+i, π = 900) → focus filter
    cenBuf[e] = new Float32Array(halfCount[e]*3);              // bonding lobe's atom centre (selection test)
    lpBuf[e]  = new Float32Array(atomCount[e]*lonePairs(e)*16); // lone-pair lobes (translucent)
    lpCenBuf[e] = new Float32Array(atomCount[e]*lonePairs(e)*3);
    lpOidBuf[e] = new Float32Array(atomCount[e]*lonePairs(e)); // per-lobe orbital id (lone pair = 2000+i)
    colBuf[e] = new Float32Array(atomCount[e]*4);   // per-instance surface colour (by component)
    cofBuf[e] = new Uint8Array(atomCount[e]);       // cofactor type code (feeds the ETC overlay)
    resBuf[e] = new Float64Array(atomCount[e]);     // globally-unique residue instance id → groups cofactor atoms into molecules
  }

  const bondDirEA = [];   // bondDirEA[element][atomIdx] = list of bond directions → used to drop doubled atomic p/d/f lobes
  for(let e=0;e<nEl;e++) bondDirEA[e] = [];
  const RINGS = [];       // detected aromatic rings → {cx,cy,cz, nx,ny,nz, R} (world) for the delocalised-π tori
  for(const m of mols){
    if(m===chl) continue;   // chlorophyll built separately (animated)
    const ox=m.ox, oy=m.oy, oz=m.oz, mi=mols.indexOf(m);
    const kel = new Int32Array(m.na), kci = new Int32Array(m.na);   // molecule atom k → (element, element-atom index)
    for(let k=0;k<m.na;k++){
      const e=m.el[k], ci=sphIdx[e]++;
      kel[k]=e; kci[k]=ci;
      BABYLON.Matrix.TranslationToRef(m.x[k]+ox, m.y[k]+oy, m.z[k]+oz, _m);
      _m.copyToArray(sphBuf[e], ci*16);
      const col = CAT_COLORS[m.cat[k]];
      colBuf[e][ci*4]=col[0]; colBuf[e][ci*4+1]=col[1]; colBuf[e][ci*4+2]=col[2]; colBuf[e][ci*4+3]=1;
      cofBuf[e][ci] = m.cof ? m.cof[k] : 0;   // cofactor type code (0 = none)
      resBuf[e][ci] = (m.sid ? m.sid[k] : 0) + mi*1000000;   // residue instance, made unique across models → exact cofactor grouping
    }
    const bd = [];                                   // per-atom bond directions
    for(let k=0;k<m.na;k++) bd[k] = [];
    // Pass 1 — accumulate every atom's bond directions.
    for(let k=0;k<m.nb;k++){
      const a1=m.b1[k], a2=m.b2[k];
      if(a1<0||a1>=m.na||a2<0||a2>=m.na) continue;
      const dx=m.x[a2]-m.x[a1], dy=m.y[a2]-m.y[a1], dz=m.z[a2]-m.z[a1];
      bd[a1].push(nrm([dx,dy,dz])); bd[a2].push(nrm([-dx,-dy,-dz]));
    }
    for(let k=0;k<m.na;k++) bondDirEA[kel[k]][kci[k]] = bd[k];   // expose bond dirs to the orbital builder
    // Per-atom bond-plane normal (cross of two non-parallel bonds) → π points out of this plane.
    const pn = [];
    for(let k=0;k<m.na;k++){
      const dirs = bd[k]; let n = null;
      for(let i=0;i<dirs.length && !n;i++) for(let j=i+1;j<dirs.length;j++){
        const c = crs(dirs[i], dirs[j]), l = Math.hypot(c[0],c[1],c[2]);

    }
    // ── Detect aromatic rings (planar 6-membered C/N cycles) → delocalised-π tori ──
    const aromSet = new Set();
    const bkey = (a,b) => a<b ? a*1000003+b : b*1000003+a;
    {
      const adj = []; for(let k=0;k<m.na;k++) adj[k]=[];
      for(let k=0;k<m.nb;k++){ const a=m.b1[k], b=m.b2[k]; if(a>=0&&b>=0&&a<m.na&&b<m.na){ adj[a].push(b); adj[b].push(a); } }

  let gWaveT = 0;             // global thermal-shake clock (bound as uT in every atom shader)
  let gSpeed = 1;             // master speed (wiggle + camera), driven by the bottom-left slider
  let gBright = 1.0;          // global brightness multiplier (dev "lighting" slider → brightness post-process)
  let gBoil = 0.2;            // line-boil amount (dev "boil" slider): stepped per-atom jitter + painterly warp (0 = off) — default 0.2
  let gRevealOn = 0;          // 1 = cofactor line-of-sight see-through active (ETC mode on, or a cofactor selected)
  let gConeTip = 0.12;        // cofactor see-through cone width AT the atom (0 = point tip → narrow; 1 = full disc → tube). Dev slider.
  let gConeBase = 0.30;       // cofactor see-through cone width toward the CAMERA. Dev slider.

  let gCofOutCol = 0.05;      // grey level of a see-through atom's outline: 0 = black → 1 = white. Dev slider.
  let gConeReach = 0.0;       // how far BEHIND the cofactor atom the cone still clears (Å). Dev slider.
  let gCofLineW = 2.2;        // cofactor silhouette outline thickness (px). Dev slider.
  // Cofactor highlight: hovered group renders 25% brighter; selecting flashes the brightness a few times.
  let gHoverGroup = -1, gFlashGroup = -1, gFlashT0 = 0, gHlGroup = -1, gHlBright = 1.0;
  const FLASH_DUR = 0.85, FLASH_PULSES = 3;   // flash length (s) + number of bright pulses on select
  const etcTypeOn = [];       // per cofactor TYPE: is its line-of-sight see-through on? (toggled by the right-side list)
  let gCofDR = null;          // the per-cofactor disc-radius buffer (0 = that cofactor's line of sight is off)
  let refreshCofDiscs = () => {};   // rebuild gCofDR from etcTypeOn (set once the discs exist)

  for(let e=0;e<nEl;e++){

    const sb=sphBuf[e], ec=info(e).c, vr=info(e).vr*FILL_SCALE, cf=cofBuf[e], rs=resBuf[e];
    for(let a=0;a<atomCount[e];a++){
      const c=getCell(cellIx(sb[a*16+12],sb[a*16+13],sb[a*16+14]));
      pushN(c.sphM, sb, a*16, 16); c.sphC.push(ec[0],ec[1],ec[2],0); c.sphR.push(vr);
      if(cf && cf[a]){ const cc=ETC_COL[cf[a]]||ec; pushN(etcM, sb, a*16, 16); etcC.push(cc[0],cc[1],cc[2],0); etcR.push(vr*1.15); etcT.push(cf[a]); etcS.push(rs[a]); etcEl.push(e); }   // cofactor → overlay, coloured by type, slightly enlarged to pop (etcEl = element for the info panel)
    }
    await yield_();
  }
  // Per-instance model tag (from each instance's world position) → the movable materials add
  // modelOff[modelId], so a whole complex drags as a unit while others stay put.
  const mdlBuf = mm => { const n=mm.length/16, a=new Float32Array(n);
    for(let i=0;i<n;i++) a[i] = modelOf(mm[i*16+12], mm[i*16+13], mm[i*16+14]); return a; };

  // vdW space-filling sphere materials (shown when the graphics toggle is in "vdW" mode). One
  // sphere per atom, per-instance radius via IMPRAD. Movable (per-model drag + PSII gizmo).
  const vdwMat = new BABYLON.ShaderMaterial('vdwLOD', scene, 'imp', {
    attributes:['position','instanceColor','instR','modelId','world0','world1','world2','world3'],
    uniforms:['view','projection','radius','fogColor','fogStart','fogEnd','isShell','shellMin','bubbleR','protonOutline','uT','boil','depthBias','selCenter','coneCos','macroXform','macroCenter','modelXform','modelCol','colorMode','selModel','selCol','cofHideOn','cofTexel','cofAlpha','cofOutAlpha','cofOutCol'],
    samplers:['cofDepth'],
    defines:['#define IMPRAD','#define MACROMOVE','#define MODELMOVE','#define COFHIDE'] });
  vdwMat.setFloat('radius',1.0); vdwMat.setFloat('isShell',0); vdwMat.setFloat('shellMin',0); vdwMat.setFloat('bubbleR',1e9);
  vdwMat.setFloat('protonOutline',0); vdwMat.setFloat('depthBias',0); vdwMat.setFloat('coneCos',-1.0);
  vdwMat.setVector3('selCenter', new BABYLON.Vector3(1e6,1e6,1e6)); vdwMat.backFaceCulling=false; realAlpha(vdwMat);
  vdwMat.onBindObservable.add(()=>{ const eff=vdwMat.getEffect(); if(!eff)return;
    eff.setFloat('isShell', gShell); eff.setFloat('shellMin', gShellMin); eff.setFloat('coneCos', gConeCos); eff.setFloat('bubbleR', gBubbleR);   // mode 1 → vdW goes 50% transparent where its atom reveals orbitals
    eff.setFloat('uT',gWaveT); eff.setMatrices('modelXform', gModelXform); eff.setArray3('modelCol', gModelCol); eff.setFloat('colorMode', gColorMode?1:0); eff.setColor3('fogColor',scene.fogColor); eff.setFloat('fogStart',scene.fogStart); eff.setFloat('fogEnd',scene.fogEnd);
    eff.setMatrix('macroXform', macroGizmoNode.getWorldMatrix()); eff.setVector3('macroCenter', psiiCenter); eff.setFloat('selModel', gSelModel); eff.setColor3('selCol', SAGE); eff.setFloat('boil', gBoil);
    bindCof(eff); });
  const vdwMatStatic = new BABYLON.ShaderMaterial('vdwLODs', scene, 'imp', {
    attributes:['position','instanceColor','instR','memAnc','world0','world1','world2','world3'],
    uniforms:['view','projection','radius','fogColor','fogStart','fogEnd','isShell','shellMin','bubbleR','protonOutline','uT','boil','depthBias','selCenter','coneCos','memCut','selModel','cofHideOn','cofTexel','cofAlpha','cofOutAlpha','cofOutCol'],
    samplers:['cofDepth'],
    defines:['#define IMPRAD','#define MEMFADE','#define COFHIDE'] });   // MEMFADE = membrane cross-cut fade
  vdwMatStatic.setFloat('radius',1.0); vdwMatStatic.setFloat('isShell',0); vdwMatStatic.setFloat('shellMin',0); vdwMatStatic.setFloat('bubbleR',1e9);
  vdwMatStatic.setFloat('protonOutline',0); vdwMatStatic.setFloat('depthBias',0); vdwMatStatic.setFloat('coneCos',-1.0);
  vdwMatStatic.setVector3('selCenter', new BABYLON.Vector3(1e6,1e6,1e6)); vdwMatStatic.backFaceCulling=false; realAlpha(vdwMatStatic); vdwMatStatic.setFloat('selModel', -1);
  vdwMatStatic.onBindObservable.add(()=>{ const eff=vdwMatStatic.getEffect(); if(!eff)return;
    eff.setFloat('isShell', gShell); eff.setFloat('shellMin', gShellMin); eff.setFloat('coneCos', gConeCos); eff.setFloat('bubbleR', gBubbleR);   // mode 1 → membrane vdW goes 50% transparent where revealed
    eff.setFloat('uT',gWaveT); eff.setFloat('boil', gBoil); eff.setFloat3('memCut', gCut[0], gCut[1], gCut[2]); eff.setColor3('fogColor',scene.fogColor); eff.setFloat('fogStart',scene.fogStart); eff.setFloat('fogEnd',scene.fogEnd);
    bindCof(eff); });

  // ── ETC cofactor overlay ──────────────────────────────────────────────────
  // The electron-transport cofactors (OEC, pheophytin, plasto-/phylloquinone, hemes, Fe-S clusters,
  // Cu) as vdW spheres, drawn in a rendering group whose depth buffer is cleared first, so they sit
  // ON TOP of the whole scene. Follows the per-model gizmo + PSII transform like the normal spheres.
  if(etcM.length){
    const etcMat = new BABYLON.ShaderMaterial('etcTop', scene, 'imp', {
      attributes:['position','instanceColor','instR','modelId','groupId','world0','world1','world2','world3'],
      uniforms:['view','projection','radius','fogColor','fogStart','fogEnd','isShell','shellMin','bubbleR','protonOutline','uT','boil','depthBias','selCenter','coneCos','macroXform','macroCenter','modelXform','modelCol','colorMode','selModel','hlGroup','hlBright'],
      defines:['#define IMPRAD','#define MACROMOVE','#define MODELMOVE','#define ETCHL'] });
    etcMat.setFloat('radius',1.0); etcMat.setFloat('selModel', -1); etcMat.setFloat('isShell',0); etcMat.setFloat('shellMin',0); etcMat.setFloat('bubbleR',1e9);
    etcMat.setFloat('protonOutline',0); etcMat.setFloat('depthBias',0); etcMat.setFloat('coneCos',-1.0);
    etcMat.setVector3('selCenter', new BABYLON.Vector3(1e6,1e6,1e6)); etcMat.backFaceCulling=false; realAlpha(etcMat);
    etcMat.onBindObservable.add(()=>{ const eff=etcMat.getEffect(); if(!eff)return;
      eff.setFloat('uT',gWaveT); eff.setFloat('boil', gBoil); eff.setMatrices('modelXform', gModelXform); eff.setArray3('modelCol', gModelCol); eff.setFloat('colorMode', 0);   // always keep the vivid per-type colours (ignore the parent pastel mode); boil so the cofactor spheres wobble like the protein
      eff.setFloat('isShell', gShell); eff.setFloat('shellMin', gShellMin); eff.setFloat('bubbleR', gBubbleR); eff.setFloat('coneCos', gConeCos);   // mode 1 → cofactor spheres go glass so their orbitals (rendered by the cells beneath) show through
      eff.setColor3('fogColor',scene.fogColor); eff.setFloat('fogStart',1e8); eff.setFloat('fogEnd',1e9);   // no fog fade → cofactors stay bright wherever they are
      eff.setFloat('hlGroup', gHlGroup); eff.setFloat('hlBright', gHlBright);   // brighten the hovered / flashing cofactor group
      eff.setMatrix('macroXform', macroGizmoNode.getWorldMatrix()); eff.setVector3('macroCenter', psiiCenter); });
    etcOverlay = BABYLON.MeshBuilder.CreatePlane('etcOverlay',{size:2},scene);
    etcOverlay.material=etcMat; etcOverlay.isPickable=false; etcOverlay.alwaysSelectAsActiveMesh=true;
    etcOverlay.thinInstanceSetBuffer('matrix', new Float32Array(etcM),16,true);
    etcOverlay.thinInstanceSetBuffer('instanceColor', new Float32Array(etcC),4,true);
    etcOverlay.thinInstanceSetBuffer('instR', new Float32Array(etcR),1,true);
    etcOverlay.thinInstanceSetBuffer('modelId', mdlBuf(etcM),1,true);
    etcOverlay.renderingGroupId = 1;                               // depth-tested WITH the protein, so cut-away outlines (atoms that really are in front) draw OVER the cofactor while it still shows through the cut holes (group 3, cleared depth, stays reserved for selection outlines)
    etcOverlay.setEnabled(gEtc);
    {
      /* Group the cofactor atoms into whole MOLECULES (one chlorophyll, one heme, one Tyr Z …).
         Grouping is by the mol2 residue instance (subst_id, made unique per model), which is exact —
         geometric clustering merged neighbouring chlorophylls, whose phytol tails interdigitate to
         within vdW contact. These groups are what a mid-range click selects, so you pick "this
         chlorophyll" rather than "this carbon". */
      const NA = etcT.length;
      const gx=new Float32Array(NA), gy=new Float32Array(NA), gz=new Float32Array(NA), gid=new Float32Array(NA);
      for(let i=0;i<NA;i++){ gx[i]=etcM[i*16+12]; gy[i]=etcM[i*16+13]; gz[i]=etcM[i*16+14]; }
      const byRes = new Map();
      for(let i=0;i<NA;i++){
        let gi = byRes.get(etcS[i]);
        if(gi === undefined){ gi = etcGroups.length; byRes.set(etcS[i], gi);
          etcGroups.push({ cx:0, cy:0, cz:0, r:0, n:0, type:etcT[i], atoms:[] }); }
        gid[i] = gi;
        const g = etcGroups[gi]; g.atoms.push(i); g.cx+=gx[i]; g.cy+=gy[i]; g.cz+=gz[i]; g.n++;
      }
      etcOverlay.thinInstanceSetBuffer('groupId', gid, 1, true);   // per-atom cofactor-group index → the shader brightens the hovered / flashing group

      for(const g of etcGroups){ g.cx/=g.n; g.cy/=g.n; g.cz/=g.n; let r2=0;
        for(const i of g.atoms){ const dx=gx[i]-g.cx, dy=gy[i]-g.cy, dz=gz[i]-g.cz, d=dx*dx+dy*dy+dz*dz; if(d>r2) r2=d; }
        g.r = Math.sqrt(r2) + 2.0; }
      etcGroupPos = { gx, gy, gz };
    }
    // ── Cofactor cut-away depth pass ── render every cofactor molecule as a disc into an off-screen
    // FLOAT buffer holding the nearest cofactor's view-space depth per pixel; the protein shader samples it.
    {
      const eng = scene.getEngine();
      const rw = Math.max(2, Math.ceil(eng.getRenderWidth()*0.34)), rh = Math.max(2, Math.ceil(eng.getRenderHeight()*0.34));   // ~third-res: the per-fragment cone depth pass has no early-z, so keep the overdraw down (soft see-through, coarse is fine)
      cofDepthRT = new BABYLON.RenderTargetTexture('cofDepth', {width:rw, height:rh}, scene, false, true,
        BABYLON.Constants.TEXTURETYPE_FLOAT, false, BABYLON.Texture.NEAREST_SAMPLINGMODE, true, false);
      cofDepthRT.clearColor = new BABYLON.Color4(0, 0, 0, 1);              // 0 reveal-depth = no cofactor cone here
      const cofCam = new BABYLON.FreeCamera('cofCam', new BABYLON.Vector3(0,0,0), scene);
      scene.removeCamera(cofCam);                                         // must not join the main render
      cofCam.layerMask = 0x20000000;                                      // sees ONLY the disc mesh (own mask, excluded from the main camera)
      cofCam.getViewMatrix = () => cam.getViewMatrix();                   // mirror the main camera exactly
      cofCam.getProjectionMatrix = () => cam.getProjectionMatrix();
      cofDepthRT.activeCamera = cofCam;
      const cofdMat = new BABYLON.ShaderMaterial('cofdMat', scene, 'cofd', {
        attributes:['position','dr','modelId','world0','world1','world2','world3'], uniforms:['view','projection','tipRatio','baseRatio','coneReach','modelXform'] });
      cofdMat.backFaceCulling = false;
      cofdMat.onBindObservable.add(()=>{ const eff=cofdMat.getEffect(); if(!eff)return;
        eff.setFloat('tipRatio', gConeTip); eff.setFloat('baseRatio', gConeBase); eff.setFloat('coneReach', gConeReach); eff.setMatrices('modelXform', gModelXform); });   // dev sliders: cone width at the atom / at the camera / reach behind · modelXform → follow a moved molecule
      const disc = BABYLON.MeshBuilder.CreatePlane('cofDisc', {size:2}, scene);
      disc.material = cofdMat; disc.isPickable = false; disc.alwaysSelectAsActiveMesh = true; disc.layerMask = 0x20000000;
      const WORLD_TUBE_R = 14.0, NA = etcT.length;                      // per-ATOM tube radius in Ångström → a FIXED molecular channel width at every zoom, wide enough that the whole line of sight in front of a cofactor clears
      disc.thinInstanceSetBuffer('matrix', new Float32Array(etcM), 16, true);   // one disc per cofactor ATOM (reuse the overlay's atom matrices)
      disc.thinInstanceSetBuffer('modelId', mdlBuf(etcM), 1, true);             // per-atom model index → the cone follows a dragged molecule
      gCofDR = new Float32Array(NA);
      for(let i=0;i<NA;i++) if(etcTypeOn[etcT[i]] === undefined) etcTypeOn[etcT[i]] = true;   // every cofactor type defaults to line-of-sight ON
      refreshCofDiscs = () => {   // per-atom tube radius (Å); 0 = that atom's type is toggled off
        for(let i=0;i<NA;i++) gCofDR[i] = etcTypeOn[etcT[i]] ? WORLD_TUBE_R : 0.0;
        disc.thinInstanceSetBuffer('dr', gCofDR, 1, true);
      };
      refreshCofDiscs();
      cofDepthRT.renderList = [disc];
      scene.customRenderTargets.push(cofDepthRT);
      gCofDisc = disc;
    }
    // ── Cofactor silhouette mask ── the cofactors rendered SOLID (white) into an off-screen buffer via a
    // mirror camera that sees ONLY this mesh (so the protein doesn't occlude it). The cofsil post-process
    // inks the OUTER edge of this filled coverage → one black outline per molecule, on top of everything.
    {
      const eng = scene.getEngine();
      const rw = Math.max(2, eng.getRenderWidth()), rh = Math.max(2, eng.getRenderHeight());   // full-res → a crisp outline that hugs the (boiling) silhouette
      cofMaskRT = new BABYLON.RenderTargetTexture('cofMask', {width:rw, height:rh}, scene, false, true,
        BABYLON.Constants.TEXTURETYPE_UNSIGNED_BYTE, false, BABYLON.Texture.BILINEAR_SAMPLINGMODE, true, false);
      cofMaskRT.clearColor = new BABYLON.Color4(0, 0, 0, 1);
      const mcam = new BABYLON.FreeCamera('cofMaskCam', new BABYLON.Vector3(0,0,0), scene);
      scene.removeCamera(mcam);
      mcam.layerMask = 0x10000000;                                       // sees ONLY the mask mesh
      mcam.getViewMatrix = () => cam.getViewMatrix();
      mcam.getProjectionMatrix = () => cam.getProjectionMatrix();
      cofMaskRT.activeCamera = mcam;
      const maskMat = new BABYLON.ShaderMaterial('cofMaskMat', scene, 'cofmask', {
        attributes:['position','dr','modelId','world0','world1','world2','world3'], uniforms:['view','projection','boilQuad','boil','uT','camRight','camUp','modelXform'] });
      maskMat.backFaceCulling = false;
      maskMat.setFloat('boilQuad', 1.28);
      maskMat.onBindObservable.add(()=>{ const eff=maskMat.getEffect(); if(!eff)return;
        eff.setFloat('boil', gBoil); eff.setFloat('uT', gWaveT); eff.setMatrices('modelXform', gModelXform);   // modelXform → the silhouette follows a moved molecule
        eff.setVector3('camRight', cam.getDirection(BABYLON.Axis.X)); eff.setVector3('camUp', cam.getDirection(BABYLON.Axis.Y)); });
      const maskMesh = BABYLON.MeshBuilder.CreatePlane('cofMaskMesh',{size:2},scene);
      maskMesh.material=maskMat; maskMesh.isPickable=false; maskMesh.alwaysSelectAsActiveMesh=true; maskMesh.layerMask=0x10000000;
      maskMesh.thinInstanceSetBuffer('matrix', new Float32Array(etcM),16,true);       // reuse the cofactor atom matrices
      maskMesh.thinInstanceSetBuffer('dr', new Float32Array(etcR),1,true);            // per-atom vdW radius → the sphere's screen silhouette
      maskMesh.thinInstanceSetBuffer('modelId', mdlBuf(etcM),1,true);                 // per-atom model index → the silhouette follows a dragged molecule
      maskMesh.setEnabled(gEtc);
      cofMaskRT.renderList = [maskMesh];
      scene.customRenderTargets.push(cofMaskRT);
      gCofMaskMesh = maskMesh;
    }
  }

  // Build per-cell SPHERE meshes now (the only geometry shown in the default vdW mode); the heavier
  // detail meshes stream in later via buildDetail(). Each entry is tagged with its cell key so the
  // deferred pass can attach the detail meshes to the right cell.
  const cellList = [];
  const cellHalfDiag = 0.5*Math.hypot(CELL,CELL,CELL);
  for(const [k,c] of cells){
    const ix=Math.floor(k/(gny*gnz)), iy=Math.floor((k%(gny*gnz))/gnz), iz=k%gnz;
    const cx=bMiX+(ix+0.5)*CELL, cy=bMiY+(iy+0.5)*CELL, cz=bMiZ+(iz+0.5)*CELL;
    let sphere=null;
    if(c.sphM.length){ sphere=BABYLON.MeshBuilder.CreatePlane('cs'+k,{size:2},scene); sphere.material=vdwMat; sphere.isPickable=false;
      sphere.thinInstanceSetBuffer('matrix', new Float32Array(c.sphM),16,true);
      sphere.thinInstanceSetBuffer('instanceColor', new Float32Array(c.sphC),4,true);
      sphere.thinInstanceSetBuffer('instR', new Float32Array(c.sphR),1,true);
      sphere.thinInstanceSetBuffer('modelId', mdlBuf(c.sphM),1,true);
      sphere.renderingGroupId=1; sphere.alwaysSelectAsActiveMesh=true; sphere.setEnabled(false); }
    const entry = { cx,cy,cz, meshes:[], nuc:null, sphere, macro:true, r:cellHalfDiag, visOn:false, nucOn:false, sphOn:false, k };
    cellList.push(entry); macroCellByKey.set(k, entry);
    await yield_();
  }

  // ── Deferred detail build: nucleons, orbitals, bond + lone-pair lobes ─────────────────────────
  // Runs in the background after the first frame. Bins the detail into the SAME cells, then attaches
  // each cell's detail meshes to its existing cellList entry (or a fresh entry for a rare detail-only
  // border cell), and finally forces the cull loop to re-apply the correct enabled state.
  buildDetail = async () => {
    await fillNucleons();
    for(let e=0;e<nEl;e++){
      if(atomCount[e]===0) continue;
      const sb=sphBuf[e], A=info(e).n, ec=info(e).c, nb=nucBuf[e], nc=nucColBuf[e];
      for(let a=0;a<atomCount[e];a++){
        const c=getCell(cellIx(sb[a*16+12],sb[a*16+13],sb[a*16+14]));
        for(let j=0;j<A;j++){ pushN(c.nucM, nb, (a*A+j)*16, 16); pushN(c.nucC, nc, (a*A+j)*4, 4); }
      }
      const oc=orbCount(e);   // Orbitals — bin by orbCenBuf (each lobe's atom centre).
      if(oc>0){ const ob=orbBuf[e], ocol=orbColBuf[e], ocen=orbCenBuf[e], oidb=orbIdBuf[e], tot=atomCount[e]*oc;
        for(let i=0;i<tot;i++){ const o=i*16;
          if(ob[o]*ob[o]+ob[o+1]*ob[o+1]+ob[o+2]*ob[o+2] < 1e-9) continue;   // skipped (bond-doubled) lobe → don't upload it
          const c=getCell(cellIx(ocen[i*3],ocen[i*3+1],ocen[i*3+2]));
          pushN(c.orbM, ob, o, 16); pushN(c.orbCol, ocol, i*3, 3); pushN(c.orbCen, ocen, i*3, 3); c.orbOid.push(oidb[i]);
        }
      }
      { const cen=cenBuf[e];   // Bonding lobes.
        for(let i=0;i<cylIdx[e];i++){ const c=getCell(cellIx(cen[i*3],cen[i*3+1],cen[i*3+2]));
          pushN(c.boM, cylBuf[e], i*16, 16); c.boT.push(wBuf[e][i]); pushN(c.boCen, cen, i*3, 3);
          c.boCol.push(ec[0],ec[1],ec[2]); c.boOid.push(cylOidBuf[e][i]);
        } }
      { const cen=lpCenBuf[e];   // Lone-pair lobes.
        for(let i=0;i<lpIdx[e];i++){ const c=getCell(cellIx(cen[i*3],cen[i*3+1],cen[i*3+2]));
          pushN(c.lpM, lpBuf[e], i*16, 16); c.lpT.push(1.0); pushN(c.lpCen, cen, i*3, 3);
          c.lpCol.push(ec[0],ec[1],ec[2]); c.lpOid.push(lpOidBuf[e][i]);
        } }
      await yield_();
    }
    for(const [k,c] of cells){
      let entry = macroCellByKey.get(k);
      if(!entry){   // a lobe centre landed in a cell with no atom sphere (rare, at cell borders) → fresh entry
        const ix=Math.floor(k/(gny*gnz)), iy=Math.floor((k%(gny*gnz))/gnz), iz=k%gnz;
        const cx=bMiX+(ix+0.5)*CELL, cy=bMiY+(iy+0.5)*CELL, cz=bMiZ+(iz+0.5)*CELL;
        entry = { cx,cy,cz, meshes:[], nuc:null, sphere:null, macro:true, r:cellHalfDiag, visOn:false, nucOn:false, sphOn:false, k };
        macroCellByKey.set(k, entry); cellList.push(entry);
      }
      if(c.nucM.length){ const m=BABYLON.MeshBuilder.CreatePlane('cn'+k,{size:2},scene); m.material=nucMatG; m.isPickable=false;
        m.thinInstanceSetBuffer('matrix', new Float32Array(c.nucM),16,true);
        m.thinInstanceSetBuffer('instanceColor', new Float32Array(c.nucC),4,true);
        m.thinInstanceSetBuffer('modelId', mdlBuf(c.nucM),1,true);
        m.renderingGroupId=1;   // nuclei drawn after the orbitals (biased depth) so they sit on top of their own atom
        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.nuc=m; }
      if(c.orbM.length){ const m=BABYLON.MeshBuilder.CreateSphere('co'+k,{segments:3,diameter:1},scene); m.material=orbMatG; m.isPickable=false;
        m.thinInstanceSetBuffer('matrix', new Float32Array(c.orbM),16,true); m.thinInstanceSetBuffer('ocol', new Float32Array(c.orbCol),3,true);
        m.thinInstanceSetBuffer('ocen', new Float32Array(c.orbCen),3,true); m.thinInstanceSetBuffer('oid', new Float32Array(c.orbOid),1,true);
        m.thinInstanceSetBuffer('modelId', mdlBuf(c.orbM),1,true);
        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.meshes.push(m); }
      if(c.boM.length){ const m=BABYLON.MeshBuilder.CreateSphere('cb'+k,{segments:3,diameter:1},scene); m.material=bondBondingMat; m.isPickable=false;
        m.thinInstanceSetBuffer('matrix', new Float32Array(c.boM),16,true); m.thinInstanceSetBuffer('taper', new Float32Array(c.boT),1,true);
        m.thinInstanceSetBuffer('ocen', new Float32Array(c.boCen),3,true); m.thinInstanceSetBuffer('bcol', new Float32Array(c.boCol),3,true); m.thinInstanceSetBuffer('oid', new Float32Array(c.boOid),1,true);
        m.thinInstanceSetBuffer('modelId', mdlBuf(c.boM),1,true);
        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.meshes.push(m); }
      if(c.lpM.length){ const m=BABYLON.MeshBuilder.CreateSphere('cl'+k,{segments:3,diameter:1},scene); m.material=bondLPMat; m.isPickable=false;
        m.thinInstanceSetBuffer('matrix', new Float32Array(c.lpM),16,true); m.thinInstanceSetBuffer('taper', new Float32Array(c.lpT),1,true);
        m.thinInstanceSetBuffer('ocen', new Float32Array(c.lpCen),3,true); m.thinInstanceSetBuffer('bcol', new Float32Array(c.lpCol),3,true); m.thinInstanceSetBuffer('oid', new Float32Array(c.lpOid),1,true);
        m.thinInstanceSetBuffer('modelId', mdlBuf(c.lpM),1,true);
        m.alwaysSelectAsActiveMesh=true; m.setEnabled(false); entry.meshes.push(m); }
      await yield_();
    }
    // The streamed-in meshes were created disabled; force the cull loop to re-apply the correct state.
    for(const entry of cellList){ if(entry.macro){ entry.visOn=-1; entry.nucOn=-1; } }
    cells.clear();
    for(let e=0;e<nEl;e++){ nucBuf[e]=nucColBuf[e]=orbCenBuf[e]=null; }   // free the per-element core buffers now baked into cells (keep orbBuf/orbColBuf + cylBuf/cenBuf/wBuf + lpBuf/lpCenBuf → the hover outline matches every fill lobe)
  };

  /* No vdW shells: every atom always shows its full orbitals (no space-filling stand-in, no
     screen-door reveal band). Orbitals render for cells near the camera; far cells simply aren't
     drawn (rather than falling back to a vdW sphere). */

  modelNode.rotationQuaternion = BABYLON.Quaternion.Identity();
  const modelGizmo = new BABYLON.PositionGizmo(gizmoLayer);
